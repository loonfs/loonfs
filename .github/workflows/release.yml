name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  darwin-arm64:
    name: darwin-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-
      - run: chmod +x scripts/package-release.sh
      # Reuse the same packaging script that CI installer smoke tests against.
      - run: ./scripts/package-release.sh "$RUNNER_TEMP/release"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/release/loon-darwin-arm64.tar.gz
            ${{ runner.temp }}/release/SHA256SUMS
          fail_on_unmatched_files: true
