name: Release LoonFS CLI

on:
  release:
    types: [published]

concurrency:
  group: release-loonfs-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve workspace version
        id: version
        run: echo "version=$(cargo pkgid -p loonfs-cli | sed 's/.*#//')" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches workspace version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected_tag="v$VERSION"
          if [ "$TAG_NAME" != "$expected_tag" ]; then
            echo "release tag $TAG_NAME does not match workspace version $expected_tag" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-loonfs-${{ matrix.target }}

      - name: Build loonfs release binary
        run: cargo build --release -p loonfs-cli --target ${{ matrix.target }}

      - name: Package release artifact
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/package-loonfs-release.sh --target "${{ matrix.target }}" --version "$VERSION" --artifact-dir dist

      - name: Sanity check packaged binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          tar -xzf "dist/loonfs-${{ matrix.target }}.tar.gz" -C "$tmpdir"
          test -x "$tmpdir/loonfs"
          test -f "$tmpdir/README.md"
          test -f "$tmpdir/LICENSE"
          test "$(cat "$tmpdir/VERSION")" = "$VERSION"
          actual="$("$tmpdir/loonfs" version)"
          actual_version="${actual%% *}"
          if [ "$actual_version" != "$VERSION" ]; then
            echo "expected loonfs version $VERSION, got: $actual" >&2
            exit 1
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: loonfs-${{ matrix.target }}
          path: dist/loonfs-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release assets
    # Default needs-gating: publish only when every build leg succeeded, so a
    # failed target can never ship a release with missing artifacts.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: loonfs-*
          merge-multiple: true

      - name: Verify release artifacts and generate checksums
        shell: bash
        working-directory: dist
        run: |
          expected=(
            loonfs-aarch64-apple-darwin.tar.gz
            loonfs-x86_64-apple-darwin.tar.gz
            loonfs-aarch64-unknown-linux-gnu.tar.gz
            loonfs-x86_64-unknown-linux-gnu.tar.gz
          )
          for file in "${expected[@]}"; do
            if [ ! -f "$file" ]; then
              echo "missing release artifact: $file" >&2
              exit 1
            fi
          done

          shopt -s nullglob
          actual=(loonfs-*.tar.gz)
          if [ "${#actual[@]}" -ne "${#expected[@]}" ]; then
            echo "expected ${#expected[@]} release artifacts, found ${#actual[@]}" >&2
            printf 'found: %s\n' "${actual[@]}" >&2
            exit 1
          fi
          sha256sum "${expected[@]}" > SHA256SUMS

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/loonfs-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
