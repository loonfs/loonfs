name: Release LoonFS

on:
  release:
    types: [published]

concurrency:
  group: release-loonfs-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  IMAGE_NAME: ghcr.io/loonfs/loonfs-server
  CHART_PATH: crates/loonfs-server/deploy/helm/loonfs-server
  CHART_REGISTRY: oci://ghcr.io/loonfs/charts

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Resolve workspace version
        id: version
        run: echo "version=$(cargo pkgid -p loonfs-cli | sed 's/.*#//')" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches workspace version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected_tag="v$VERSION"
          if [ "$TAG_NAME" != "$expected_tag" ]; then
            echo "release tag $TAG_NAME does not match workspace version $expected_tag" >&2
            exit 1
          fi

      # The chart ships in this release and names the server version it runs,
      # so a chart that disagrees with the tag would publish a wrong default
      # image. `sed` reads the two lines rather than a YAML tool, because the
      # runner promises no such tool.
      - name: Validate chart version matches workspace version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chart="$CHART_PATH/Chart.yaml"
          chart_version="$(sed -n 's/^version: *//p' "$chart" | tr -d '"')"
          app_version="$(sed -n 's/^appVersion: *//p' "$chart" | tr -d '"')"
          if [ "$chart_version" != "$VERSION" ]; then
            echo "chart version $chart_version does not match workspace version $VERSION" >&2
            exit 1
          fi
          if [ "$app_version" != "$VERSION" ]; then
            echo "chart appVersion $app_version does not match workspace version $VERSION" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-loonfs-${{ matrix.target }}

      - name: Build loonfs release binary
        run: cargo build --release -p loonfs-cli --target ${{ matrix.target }}

      - name: Package release artifact
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/package-loonfs-release.sh --target "${{ matrix.target }}" --version "$VERSION" --artifact-dir dist

      - name: Sanity check packaged binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          tar -xzf "dist/loonfs-${{ matrix.target }}.tar.gz" -C "$tmpdir"
          test -x "$tmpdir/loonfs"
          test -f "$tmpdir/README.md"
          test -f "$tmpdir/LICENSE"
          test "$(cat "$tmpdir/VERSION")" = "$VERSION"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loonfs-${{ matrix.target }}
          path: dist/loonfs-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  # One image per architecture, each built on a runner of that architecture,
  # so no emulation is involved. Each leg pushes its image by digest and
  # carries no tag: the merge job below is what publishes the tag.
  server-image:
    name: Build server image ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build carries no cache. A release image is built from the tag's
      # own source every time.
      #
      # `provenance: false` keeps each push a plain single-platform image. An
      # attestation manifest would make it an index instead, and the merged
      # manifest would then carry `unknown/unknown` entries beside the two
      # architectures the release claims.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: crates/loonfs-server/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}
          provenance: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      # The released image is the tested image: this pulls the digest the step
      # above pushed and runs the image test against those exact bytes. Both
      # legs run it, because both images ship.
      - name: Test the image this job pushed
        env:
          LOONFS_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$LOONFS_IMAGE"
          crates/loonfs-server/scripts/test-image.sh

      - name: Record the digest for the manifest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in
            sha256:*) ;;
            *)
              echo "the build reported no image digest: $DIGEST" >&2
              exit 1
              ;;
          esac
          mkdir -p digests
          echo "$DIGEST" > "digests/$ARCH"

      - name: Upload the digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-image-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  server-image-manifest:
    name: Publish server image
    needs: [prepare, server-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.manifest.outputs.tag }}
      digest: ${{ steps.manifest.outputs.digest }}
      platforms: ${{ steps.manifest.outputs.platforms }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: digests
          pattern: server-image-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both per-architecture images are already in the registry, addressed by
      # digest and carrying no tag. This step publishes the release: it creates
      # the one manifest the tag names, then reads that manifest back and
      # proves it carries both architectures.
      - name: Create the multi-platform manifest
        id: manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="$IMAGE_NAME:v$VERSION"
          docker buildx imagetools create --tag "$tag" \
            "$IMAGE_NAME@$(cat digests/amd64)" \
            "$IMAGE_NAME@$(cat digests/arm64)"

          digest="$(docker buildx imagetools inspect "$tag" --format '{{ .Manifest.Digest }}')"
          case "$digest" in
            sha256:*) ;;
            *)
              echo "the published manifest reported no digest: $digest" >&2
              exit 1
              ;;
          esac

          raw="$(docker buildx imagetools inspect "$tag" --raw)"
          platforms="$(jq -r '[.manifests[] | "\(.platform.os)/\(.platform.architecture)"] | join(", ")' <<<"$raw")"
          for required in linux/amd64 linux/arm64; do
            case ", $platforms, " in
              *", $required, "*) ;;
              *)
                echo "the published manifest does not carry $required: $platforms" >&2
                exit 1
                ;;
            esac
          done

          {
            echo "tag=$tag"
            echo "digest=$digest"
            echo "platforms=$platforms"
          } >> "$GITHUB_OUTPUT"

  helm-publish:
    name: Publish Helm chart
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.push.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      # The runner ships helm, so this job installs nothing. `helm lint` runs
      # the chart's strict values schema, and that schema requires a config
      # Secret name. The chart creates no Secret and reads none while it
      # renders, so any name works here.
      - name: Lint the chart
        run: helm lint "$CHART_PATH" --set config.existingSecret=release

      # The chart's own Chart.yaml already carries this version, and prepare
      # refused the release otherwise. Passing it again names the version this
      # package claims in the one command that builds it.
      - name: Package the chart
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          helm package "$CHART_PATH" \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist

      - name: Log in to ghcr.io
        shell: bash
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Push the chart
        id: push
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          package="dist/loonfs-server-$VERSION.tgz"
          test -f "$package"
          helm push "$package" "$CHART_REGISTRY" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: *//p' push.log | tr -d '[:space:]')"
          case "$digest" in
            sha256:*) ;;
            *)
              echo "helm push reported no chart digest" >&2
              exit 1
              ;;
          esac
          {
            echo "version=$VERSION"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish release assets
    # Default needs-gating: publish only when every build leg succeeded, so a
    # failed target can never ship a release with missing artifacts. The image
    # and the chart are in that set, so the release names them only once they
    # are in the registry.
    needs: [prepare, build, server-image-manifest, helm-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: loonfs-*
          merge-multiple: true

      - name: Verify release artifacts and record what the release ships
        shell: bash
        working-directory: dist
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_TAG: ${{ needs.server-image-manifest.outputs.tag }}
          IMAGE_DIGEST: ${{ needs.server-image-manifest.outputs.digest }}
          IMAGE_PLATFORMS: ${{ needs.server-image-manifest.outputs.platforms }}
          CHART_VERSION: ${{ needs.helm-publish.outputs.version }}
          CHART_DIGEST: ${{ needs.helm-publish.outputs.digest }}
        run: |
          expected=(
            loonfs-aarch64-apple-darwin.tar.gz
            loonfs-x86_64-apple-darwin.tar.gz
            loonfs-aarch64-unknown-linux-gnu.tar.gz
            loonfs-x86_64-unknown-linux-gnu.tar.gz
          )
          for file in "${expected[@]}"; do
            if [ ! -f "$file" ]; then
              echo "missing release artifact: $file" >&2
              exit 1
            fi
          done

          shopt -s nullglob
          actual=(loonfs-*.tar.gz)
          if [ "${#actual[@]}" -ne "${#expected[@]}" ]; then
            echo "expected ${#expected[@]} release artifacts, found ${#actual[@]}" >&2
            printf 'found: %s\n' "${actual[@]}" >&2
            exit 1
          fi
          sha256sum "${expected[@]}" > SHA256SUMS

          # The image and the chart go to a registry rather than to the
          # release page, so the same check covers them as coordinates. A
          # release never names an artifact its own jobs did not report.
          for name in IMAGE_TAG IMAGE_DIGEST IMAGE_PLATFORMS CHART_VERSION CHART_DIGEST; do
            if [ -z "${!name}" ]; then
              echo "the release records no $name" >&2
              exit 1
            fi
          done

          {
            echo "LoonFS v$VERSION"
            echo
            echo "CLI archives, with their checksums in SHA256SUMS:"
            printf '  %s\n' "${expected[@]}"
            echo
            echo "Server image:"
            echo "  tag:           $IMAGE_TAG"
            echo "  digest:        $IMAGE_DIGEST"
            echo "  architectures: $IMAGE_PLATFORMS"
            echo
            echo "Helm chart:"
            echo "  chart:   $CHART_REGISTRY/loonfs-server"
            echo "  version: $CHART_VERSION"
            echo "  digest:  $CHART_DIGEST"
          } > ARTIFACTS.txt
          cat ARTIFACTS.txt

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/loonfs-*.tar.gz
            dist/SHA256SUMS
            dist/ARTIFACTS.txt
          fail_on_unmatched_files: true

  publish-crates:
    name: Publish crates
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for crate in \
            loonfs-api \
            loonfs-objectstore \
            loonfs-client \
            loonfs-core \
            loonfs \
            loonfs-grep \
            loonfs-cli
          do
            status="$(curl --silent --show-error --retry 3 --output /dev/null \
              --user-agent 'loonfs-release (https://github.com/loonfs/loonfs)' \
              --write-out '%{http_code}' "https://crates.io/api/v1/crates/$crate/$VERSION")"
            case "$status" in
              200) echo "$crate $VERSION is already published" ;;
              404) cargo publish --package "$crate" --locked ;;
              *)
                echo "could not check $crate $VERSION on crates.io (HTTP $status)" >&2
                exit 1
                ;;
            esac
          done

  update-homebrew:
    name: Update Homebrew
    needs: [prepare, publish]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loonfs/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update the formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          latest="$(gh release view --repo loonfs/loonfs --json tagName --jq .tagName)"
          if [ "v$VERSION" != "$latest" ]; then
            echo "Skipping Homebrew update for an older release"
            exit 0
          fi
          scripts/bump-homebrew-tap.sh --version "$VERSION" --tap-dir homebrew-tap

      - name: Commit and push the formula
        working-directory: homebrew-tap
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet -- Formula/loonfs.rb; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/loonfs.rb
          git commit -m "chore: update to $TAG_NAME"
          git push origin HEAD:main

  update-website:
    name: Update API reference
    needs: publish
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          path: loonfs
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loonfs/loonfs_www
          ref: main
          path: loonfs_www
          token: ${{ secrets.LOONFS_WWW_TOKEN }}

      - name: Sync the API reference
        id: sync
        working-directory: loonfs_www
        env:
          GH_TOKEN: ${{ github.token }}
          LOONFS_OPENAPI_REF: ${{ github.event.release.tag_name }}
        run: |
          latest="$(gh release view --repo loonfs/loonfs --json tagName --jq .tagName)"
          if [ "$LOONFS_OPENAPI_REF" != "$latest" ]; then
            echo "Skipping API reference update for an older release"
            exit 0
          fi
          npm run sync:openapi
          echo "synced=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the reference PR
        if: steps.sync.outputs.synced == 'true'
        id: pull_request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.LOONFS_WWW_TOKEN }}
          path: loonfs_www
          add-paths: src/openapi/loonfs.json
          branch: release/${{ github.event.release.tag_name }}
          title: "docs: update API reference for ${{ github.event.release.tag_name }}"
          commit-message: "docs: update API reference for ${{ github.event.release.tag_name }}"
          body: "Update the API reference from LoonFS ${{ github.event.release.tag_name }}."

      - name: Merge the reference PR
        if: steps.pull_request.outputs.pull-request-number
        working-directory: loonfs_www
        env:
          GH_TOKEN: ${{ secrets.LOONFS_WWW_TOKEN }}
          PR_URL: ${{ steps.pull_request.outputs.pull-request-url }}
          PR_HEAD: ${{ steps.pull_request.outputs.pull-request-head-sha }}
        run: gh pr merge "$PR_URL" --squash --match-head-commit "$PR_HEAD"

  verify-install:
    name: Verify published CLI install
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Install the release and check its version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/loonfs/loonfs/main/scripts/install-loonfs.sh \
            -o "$RUNNER_TEMP/install-loonfs.sh"
          sh "$RUNNER_TEMP/install-loonfs.sh" \
            --version "$TAG_NAME" --install-dir "$RUNNER_TEMP/loonfs-bin"
          test "$("$RUNNER_TEMP/loonfs-bin/loonfs" --version)" = "loonfs $VERSION"
