name: Release LoonFS

on:
  release:
    types: [published]

concurrency:
  group: release-loonfs-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  IMAGE_NAME: ghcr.io/loonfs/loonfs-server
  CHART_PATH: crates/loonfs-server/deploy/helm/loonfs-server
  CHART_REGISTRY: oci://ghcr.io/loonfs/charts

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source is on the default branch
        id: source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse --verify "refs/tags/$TAG_NAME^{commit}")"
          default_ref="refs/remotes/origin/$DEFAULT_BRANCH"

          if [ "$source_sha" != "$tag_sha" ]; then
            echo "checked out $source_sha, but $TAG_NAME resolves to $tag_sha" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "$default_ref"; then
            echo "checkout did not fetch $default_ref" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$source_sha" "$default_ref"; then
            echo "release tag $TAG_NAME is not on $DEFAULT_BRANCH" >&2
            exit 1
          fi

          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Resolve workspace version
        id: version
        run: echo "version=$(cargo pkgid -p loonfs-cli | sed 's/.*#//')" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches workspace version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected_tag="v$VERSION"
          if [ "$TAG_NAME" != "$expected_tag" ]; then
            echo "release tag $TAG_NAME does not match workspace version $expected_tag" >&2
            exit 1
          fi

      # The chart version and default server image must match the release.
      - name: Validate chart version matches workspace version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chart="$CHART_PATH/Chart.yaml"
          chart_version="$(sed -n 's/^version: *//p' "$chart" | tr -d '"')"
          app_version="$(sed -n 's/^appVersion: *//p' "$chart" | tr -d '"')"
          if [ "$chart_version" != "$VERSION" ]; then
            echo "chart version $chart_version does not match workspace version $VERSION" >&2
            exit 1
          fi
          if [ "$app_version" != "$VERSION" ]; then
            echo "chart appVersion $app_version does not match workspace version $VERSION" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install stable toolchain
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target "${{ matrix.target }}"
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ github.job }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.target }}-${{ github.job }}-${{ steps.rust.outputs.version }}-

      - name: Build loonfs release binary
        run: cargo build --release -p loonfs-cli --target ${{ matrix.target }}

      - name: Package release artifact
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/package-loonfs-release.sh --target "${{ matrix.target }}" --version "$VERSION" --artifact-dir dist

      - name: Sanity check packaged binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          tar -xzf "dist/loonfs-${{ matrix.target }}.tar.gz" -C "$tmpdir"
          test -x "$tmpdir/loonfs"
          test -f "$tmpdir/README.md"
          test -f "$tmpdir/LICENSE"
          test "$(cat "$tmpdir/VERSION")" = "$VERSION"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loonfs-${{ matrix.target }}
          path: dist/loonfs-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Build and test each architecture natively before tagging the combined image.
  server-image:
    name: Build server image ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: crates/loonfs-server/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}
          # Keep attestation entries out of the combined platform manifest.
          provenance: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Test the published image by digest
        env:
          LOONFS_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$LOONFS_IMAGE"
          crates/loonfs-server/scripts/test-image.sh

      - name: Record the digest for the manifest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in
            sha256:*) ;;
            *)
              echo "the build reported no image digest: $DIGEST" >&2
              exit 1
              ;;
          esac
          mkdir -p digests
          echo "$DIGEST" > "digests/$ARCH"

      - name: Upload the digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-image-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  server-image-manifest:
    name: Publish server image
    needs: [prepare, server-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.manifest.outputs.tag }}
      digest: ${{ steps.manifest.outputs.digest }}
      platforms: ${{ steps.manifest.outputs.platforms }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: digests
          pattern: server-image-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-platform manifest
        id: manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="$IMAGE_NAME:v$VERSION"
          docker buildx imagetools create --tag "$tag" \
            "$IMAGE_NAME@$(cat digests/amd64)" \
            "$IMAGE_NAME@$(cat digests/arm64)"

          digest="$(docker buildx imagetools inspect "$tag" --format '{{ .Manifest.Digest }}')"
          case "$digest" in
            sha256:*) ;;
            *)
              echo "the published manifest reported no digest: $digest" >&2
              exit 1
              ;;
          esac

          raw="$(docker buildx imagetools inspect "$tag" --raw)"
          platforms="$(jq -r '[.manifests[] | "\(.platform.os)/\(.platform.architecture)"] | join(", ")' <<<"$raw")"
          for required in linux/amd64 linux/arm64; do
            case ", $platforms, " in
              *", $required, "*) ;;
              *)
                echo "the published manifest does not carry $required: $platforms" >&2
                exit 1
                ;;
            esac
          done

          {
            echo "tag=$tag"
            echo "digest=$digest"
            echo "platforms=$platforms"
          } >> "$GITHUB_OUTPUT"

  helm-publish:
    name: Publish Helm chart
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.push.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      # Rendering requires a Secret name, but does not read the Secret.
      - name: Lint the chart
        run: helm lint "$CHART_PATH" --set config.existingSecret=release

      - name: Package the chart
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          helm package "$CHART_PATH" \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist

      - name: Log in to ghcr.io
        shell: bash
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Push the chart
        id: push
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          package="dist/loonfs-server-$VERSION.tgz"
          test -f "$package"
          helm push "$package" "$CHART_REGISTRY" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: *//p' push.log | tr -d '[:space:]')"
          case "$digest" in
            sha256:*) ;;
            *)
              echo "helm push reported no chart digest" >&2
              exit 1
              ;;
          esac
          {
            echo "version=$VERSION"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish release assets
    # Upload assets only after all binaries, images, and the chart succeed.
    needs: [prepare, build, server-image-manifest, helm-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: loonfs-*
          merge-multiple: true

      - name: Verify release artifacts and write the manifest
        shell: bash
        working-directory: dist
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_TAG: ${{ needs.server-image-manifest.outputs.tag }}
          IMAGE_DIGEST: ${{ needs.server-image-manifest.outputs.digest }}
          IMAGE_PLATFORMS: ${{ needs.server-image-manifest.outputs.platforms }}
          CHART_VERSION: ${{ needs.helm-publish.outputs.version }}
          CHART_DIGEST: ${{ needs.helm-publish.outputs.digest }}
        run: |
          expected=(
            loonfs-aarch64-apple-darwin.tar.gz
            loonfs-x86_64-apple-darwin.tar.gz
            loonfs-aarch64-unknown-linux-gnu.tar.gz
            loonfs-x86_64-unknown-linux-gnu.tar.gz
          )
          for file in "${expected[@]}"; do
            if [ ! -f "$file" ]; then
              echo "missing release artifact: $file" >&2
              exit 1
            fi
          done

          shopt -s nullglob
          actual=(loonfs-*.tar.gz)
          if [ "${#actual[@]}" -ne "${#expected[@]}" ]; then
            echo "expected ${#expected[@]} release artifacts, found ${#actual[@]}" >&2
            printf 'found: %s\n' "${actual[@]}" >&2
            exit 1
          fi
          sha256sum "${expected[@]}" > SHA256SUMS

          # Require the image and chart details before listing them in the release.
          for name in IMAGE_TAG IMAGE_DIGEST IMAGE_PLATFORMS CHART_VERSION CHART_DIGEST; do
            if [ -z "${!name}" ]; then
              echo "the release records no $name" >&2
              exit 1
            fi
          done

          {
            echo "LoonFS v$VERSION"
            echo
            echo "CLI archives, with their checksums in SHA256SUMS:"
            printf '  %s\n' "${expected[@]}"
            echo
            echo "Server image:"
            echo "  tag:           $IMAGE_TAG"
            echo "  digest:        $IMAGE_DIGEST"
            echo "  architectures: $IMAGE_PLATFORMS"
            echo
            echo "Helm chart:"
            echo "  chart:   $CHART_REGISTRY/loonfs-server"
            echo "  version: $CHART_VERSION"
            echo "  digest:  $CHART_DIGEST"
          } > ARTIFACTS.txt
          cat ARTIFACTS.txt

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/loonfs-*.tar.gz dist/SHA256SUMS dist/ARTIFACTS.txt

  publish-crates:
    name: Publish crates
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Install stable toolchain
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for crate in \
            loonfs-api \
            loonfs-objectstore \
            loonfs-client \
            loonfs-core \
            loonfs \
            loonfs-grep \
            loonfs-cli
          do
            status="$(curl --silent --show-error --retry 3 --output /dev/null \
              --user-agent 'loonfs-release (https://github.com/loonfs/loonfs)' \
              --write-out '%{http_code}' "https://crates.io/api/v1/crates/$crate/$VERSION")"
            case "$status" in
              200) echo "$crate $VERSION is already published" ;;
              404) cargo publish --package "$crate" --locked ;;
              *)
                echo "could not check $crate $VERSION on crates.io (HTTP $status)" >&2
                exit 1
                ;;
            esac
          done

  update-homebrew:
    name: Update Homebrew
    needs: [prepare, publish]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loonfs/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update the formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          latest="$(gh release view --repo loonfs/loonfs --json tagName --jq .tagName)"
          if [ "v$VERSION" != "$latest" ]; then
            echo "Skipping Homebrew update for an older release"
            exit 0
          fi
          scripts/bump-homebrew-tap.sh --version "$VERSION" --tap-dir homebrew-tap

      - name: Commit and push the formula
        working-directory: homebrew-tap
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet -- Formula/loonfs.rb; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/loonfs.rb
          git commit -m "chore: update to $TAG_NAME"
          git push origin HEAD:main

  verify-install:
    name: Verify published CLI install
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Install the release and check its version
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/loonfs/loonfs/$SOURCE_SHA/scripts/install-loonfs.sh" \
            -o "$RUNNER_TEMP/install-loonfs.sh"
          sh "$RUNNER_TEMP/install-loonfs.sh" \
            --version "$TAG_NAME" --install-dir "$RUNNER_TEMP/loonfs-bin"
          test "$("$RUNNER_TEMP/loonfs-bin/loonfs" --version)" = "loonfs $VERSION"
