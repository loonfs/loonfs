name: Credentialed providers

# Runs the ignored tests that need a real object store: the loonfs-objectstore
# conformance tests for each provider, and for GCS also the loonfs-server
# direct-put tests. A provider's steps run only when its secrets are set, so a
# fork or a repository without them skips that provider.
#
# Repository secrets, named as the environment variables the tests read
# (crates/loonfs-objectstore/tests/provider-conformance.env.example):
#
#   AWS S3 (required): LOONFS_TEST_S3_BUCKET, LOONFS_TEST_S3_REGION,
#     LOONFS_TEST_S3_ACCESS_KEY_ID, LOONFS_TEST_S3_SECRET_ACCESS_KEY
#   AWS S3 (optional): LOONFS_TEST_S3_ENDPOINT, LOONFS_TEST_S3_SESSION_TOKEN,
#     LOONFS_TEST_S3_PREFIX
#   Cloudflare R2 (required): LOONFS_TEST_R2_BUCKET, LOONFS_TEST_R2_ACCOUNT_ID,
#     LOONFS_TEST_R2_ENDPOINT, LOONFS_TEST_R2_ACCESS_KEY_ID,
#     LOONFS_TEST_R2_SECRET_ACCESS_KEY
#   Cloudflare R2 (optional): LOONFS_TEST_R2_PREFIX
#   GCP GCS (required): LOONFS_TEST_GCS_BUCKET, and
#     LOONFS_TEST_GCS_SERVICE_ACCOUNT_KEY, the service account's JSON key file
#     contents, which the job writes to a file and passes to the tests as
#     LOONFS_TEST_GCS_SERVICE_ACCOUNT_KEY_PATH
#   GCP GCS (optional): LOONFS_TEST_GCS_PREFIX

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: credentialed-providers
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  aws_s3:
    name: AWS S3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOONFS_TEST_S3_BUCKET: ${{ secrets.LOONFS_TEST_S3_BUCKET }}
      LOONFS_TEST_S3_REGION: ${{ secrets.LOONFS_TEST_S3_REGION }}
      LOONFS_TEST_S3_ACCESS_KEY_ID: ${{ secrets.LOONFS_TEST_S3_ACCESS_KEY_ID }}
      LOONFS_TEST_S3_SECRET_ACCESS_KEY: ${{ secrets.LOONFS_TEST_S3_SECRET_ACCESS_KEY }}
      LOONFS_TEST_S3_ENDPOINT: ${{ secrets.LOONFS_TEST_S3_ENDPOINT }}
      LOONFS_TEST_S3_SESSION_TOKEN: ${{ secrets.LOONFS_TEST_S3_SESSION_TOKEN }}
      LOONFS_TEST_S3_PREFIX: ${{ secrets.LOONFS_TEST_S3_PREFIX }}
    steps:
      - if: env.LOONFS_TEST_S3_ACCESS_KEY_ID == ''
        run: echo "::notice::AWS S3 secrets aren't set, so the AWS S3 tests were skipped"
      - if: env.LOONFS_TEST_S3_ACCESS_KEY_ID != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: env.LOONFS_TEST_S3_ACCESS_KEY_ID != ''
        id: rust
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - if: env.LOONFS_TEST_S3_ACCESS_KEY_ID != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-
      - if: env.LOONFS_TEST_S3_ACCESS_KEY_ID != ''
        run: cargo test -p loonfs-objectstore --test it --locked -- --ignored objectstore_conformance::aws_s3_

  cloudflare_r2:
    name: Cloudflare R2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOONFS_TEST_R2_BUCKET: ${{ secrets.LOONFS_TEST_R2_BUCKET }}
      LOONFS_TEST_R2_ACCOUNT_ID: ${{ secrets.LOONFS_TEST_R2_ACCOUNT_ID }}
      LOONFS_TEST_R2_ENDPOINT: ${{ secrets.LOONFS_TEST_R2_ENDPOINT }}
      LOONFS_TEST_R2_ACCESS_KEY_ID: ${{ secrets.LOONFS_TEST_R2_ACCESS_KEY_ID }}
      LOONFS_TEST_R2_SECRET_ACCESS_KEY: ${{ secrets.LOONFS_TEST_R2_SECRET_ACCESS_KEY }}
      LOONFS_TEST_R2_PREFIX: ${{ secrets.LOONFS_TEST_R2_PREFIX }}
    steps:
      - if: env.LOONFS_TEST_R2_ACCESS_KEY_ID == ''
        run: echo "::notice::Cloudflare R2 secrets aren't set, so the Cloudflare R2 tests were skipped"
      - if: env.LOONFS_TEST_R2_ACCESS_KEY_ID != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: env.LOONFS_TEST_R2_ACCESS_KEY_ID != ''
        id: rust
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - if: env.LOONFS_TEST_R2_ACCESS_KEY_ID != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-
      - if: env.LOONFS_TEST_R2_ACCESS_KEY_ID != ''
        run: cargo test -p loonfs-objectstore --test it --locked -- --ignored objectstore_conformance::cloudflare_r2_

  gcp_gcs:
    name: GCP GCS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOONFS_TEST_GCS_BUCKET: ${{ secrets.LOONFS_TEST_GCS_BUCKET }}
      LOONFS_TEST_GCS_SERVICE_ACCOUNT_KEY: ${{ secrets.LOONFS_TEST_GCS_SERVICE_ACCOUNT_KEY }}
      LOONFS_TEST_GCS_PREFIX: ${{ secrets.LOONFS_TEST_GCS_PREFIX }}
    steps:
      - if: env.LOONFS_TEST_GCS_SERVICE_ACCOUNT_KEY == ''
        run: echo "::notice::GCP GCS secrets aren't set, so the GCP GCS tests were skipped"
      - if: env.LOONFS_TEST_GCS_SERVICE_ACCOUNT_KEY != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: env.LOONFS_TEST_GCS_SERVICE_ACCOUNT_KEY != ''
        id: rust
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - if: env.LOONFS_TEST_GCS_SERVICE_ACCOUNT_KEY != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-
      # The tests read the key from a file.
      - if: env.LOONFS_TEST_GCS_SERVICE_ACCOUNT_KEY != ''
        run: |
          key_path="$RUNNER_TEMP/gcs-service-account.json"
          printf '%s' "$LOONFS_TEST_GCS_SERVICE_ACCOUNT_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "LOONFS_TEST_GCS_SERVICE_ACCOUNT_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - if: env.LOONFS_TEST_GCS_SERVICE_ACCOUNT_KEY != ''
        run: cargo test -p loonfs-objectstore --test it --locked -- --ignored objectstore_conformance::gcp_gcs_
      - if: env.LOONFS_TEST_GCS_SERVICE_ACCOUNT_KEY != ''
        run: cargo test -p loonfs-server --test it --locked -- --ignored direct_put_real_provider::gcp_gcs_
