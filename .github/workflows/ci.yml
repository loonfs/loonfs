name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: rust
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  # Stop tests that hang while waiting for a blocking-store gate.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo test --all --locked
      - run: cargo test -p loonfs-server --features openapi --locked openapi

  # Builds the conformance server once; the three language legs download it.
  sdk-conformance-server:
    name: SDK conformance server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: rust
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-
      - run: cargo build -p loonfs-conformance --bin conformance-server --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-server
          path: target/debug/conformance-server
          if-no-files-found: error
          retention-days: 1

  sdk-conformance:
    name: SDK conformance (${{ matrix.display }})
    needs: sdk-conformance-server
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            display: Go
          - language: python
            display: Python
          - language: typescript
            display: TypeScript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.language == 'go'
        with:
          go-version: 1.22.x
          cache-dependency-path: sdk/conformance/go/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.language == 'python'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdk/conformance/python/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.language == 'typescript'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/conformance/typescript/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conformance-server
          path: target/debug
      - run: chmod +x target/debug/conformance-server
      - run: scripts/generate-sdks.sh ${{ matrix.language }}
      - run: scripts/run-sdk-conformance.sh ${{ matrix.language }}
        env:
          LOONFS_CONFORMANCE_SERVER_BIN: ${{ github.workspace }}/target/debug/conformance-server

  # Keep this toolchain in sync with workspace.package.rust-version.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: rust
        run: |
          rustup toolchain install 1.88 --profile minimal --no-self-update
          echo "version=$(rustc +1.88 --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-
      - run: cargo +1.88 check --workspace --all-targets --all-features --locked

  # Test probes, authentication, persistence, shutdown, and the non-root user.
  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: crates/loonfs-server/Dockerfile
          tags: loonfs-server:ci
          # Load the image into Docker for the test below.
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: crates/loonfs-server/scripts/test-image.sh
        env:
          LOONFS_IMAGE: loonfs-server:ci

  # Validate the chart's schema, template branches, and single-writer settings.
  helm:
    name: helm
    runs-on: ubuntu-latest
    env:
      CHART: crates/loonfs-server/deploy/helm/loonfs-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: helm version
      - name: lint
        run: helm lint "$CHART" --set config.existingSecret=test
      - name: render every value combination
        run: |
          helm template rel "$CHART" --set config.existingSecret=test >/dev/null
          helm template rel "$CHART" --set config.existingSecret=test \
            --set localCache.enabled=true --set localCache.sizeLimit=100Gi >/dev/null
          helm template rel "$CHART" --set config.existingSecret=test --set image.tag=9.9.9 >/dev/null
          helm template rel "$CHART" --set config.existingSecret=test \
            --set image.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111 >/dev/null
          helm template rel "$CHART" --set config.existingSecret=test \
            --set 'extraEnvFrom[0].secretRef.name=loonfs-server-secrets' >/dev/null
      - name: reject an unbounded local cache
        run: |
          if output="$(helm template rel "$CHART" --set config.existingSecret=test \
            --set localCache.enabled=true 2>&1)"; then
            echo "FAIL: enabled cache without localCache.sizeLimit rendered" >&2
            exit 1
          fi
          grep -q 'localCache.sizeLimit.*cache emptyDir.*disk_bytes' <<<"$output"
      - name: assert the single-writer settings
        run: |
          rendered="$(helm template rel "$CHART" --set config.existingSecret=test)"
          assert_line() {
            grep -qE "$1" <<<"$rendered" || {
              echo "FAIL: the render has no line matching $1" >&2
              exit 1
            }
            echo "ok: $1"
          }
          assert_line '^  replicas: 1$'
          assert_line '^    type: Recreate$'
          assert_line '^      automountServiceAccountToken: false$'

  dist:
    name: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: rust
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust.outputs.version }}-
      - run: scripts/test-install-loonfs.sh
