name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  # The blocking-store gates in `loonfs-test-support` wait without a
  # wall-clock deadline of their own, so a gate nobody opens shows up as a
  # hung job. This is the bound that reports it; without it the job would
  # sit at GitHub's six-hour default.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-deps-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-deps-v1-
      - run: cargo test --all --locked
      - run: cargo test -p loonfs-server --features openapi --locked openapi

  sdk-conformance-go:
    name: SDK conformance (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: false
      - run: scripts/generate-sdks.sh go
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-sdk-conformance-${{ hashFiles('sdk/generated/go/go.sum', 'sdk/conformance/go/go.mod') }}
          restore-keys: ${{ runner.os }}-go-sdk-conformance-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sdk-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sdk-conformance-
      - run: scripts/run-sdk-conformance.sh go

  sdk-conformance-python:
    name: SDK conformance (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: scripts/generate-sdks.sh python
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-sdk-conformance-${{ hashFiles('sdk/conformance/python/requirements.txt') }}
          restore-keys: ${{ runner.os }}-python-sdk-conformance-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sdk-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sdk-conformance-
      - run: scripts/run-sdk-conformance.sh python

  sdk-conformance-typescript:
    name: SDK conformance (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: scripts/generate-sdks.sh typescript
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-typescript-sdk-conformance-${{ hashFiles('sdk/conformance/typescript/package.json') }}
          restore-keys: ${{ runner.os }}-typescript-sdk-conformance-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sdk-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sdk-conformance-
      - run: scripts/run-sdk-conformance.sh typescript

  sdk-client-typescript:
    name: SDK browser client (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: scripts/generate-sdks.sh typescript-client
      - run: cd sdk/client-check && npm install --no-fund --no-audit && npm run check

  # Checks the declared minimum supported Rust version actually builds the
  # workspace. Keep the toolchain here in sync with `rust-version` in the
  # workspace Cargo.toml.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-
      - run: cargo +1.85 check --workspace --all-targets --all-features --locked

  # Builds the server image and proves it works: the probes answer, the
  # process is not root, the bearer token is enforced, durable state survives
  # a restart, and SIGTERM exits zero. The script asserts all of that, so this
  # job is the script's exit code.
  #
  # The job runs on every change, the way every other job here does. A path
  # filter would be wrong for this one in any case: the image carries the
  # whole workspace's code, so a change to any crate can change it.
  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/loonfs-server/Dockerfile
          tags: loonfs-server:ci
          # Into the runner's own image store, so the test below runs the
          # image this step built.
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # LOONFS_IMAGE is what tells the script to test an existing image
      # instead of building its own, so the cached build above is the one
      # under test.
      - run: crates/loonfs-server/scripts/test-image.sh
        env:
          LOONFS_IMAGE: loonfs-server:ci

  # Lints and renders the server's Helm chart. `helm lint` runs the chart's
  # strict values schema, so a value name the chart does not know fails here
  # rather than being ignored. The renders cover the combinations that take
  # different template branches, and the last step greps one render for the
  # three settings that make the chart correct for a single-writer server.
  # Those three live in the template rather than in values, so this job is
  # what stops an edit from turning them into something else.
  #
  # The runner ships helm, so the job installs nothing.
  helm:
    name: helm
    runs-on: ubuntu-latest
    env:
      CHART: crates/loonfs-server/deploy/helm/loonfs-server
      # The schema requires a config Secret name, so every command below
      # supplies one. The chart creates no Secret and reads none while it
      # renders, so any name works here.
      SECRET: --set config.existingSecret=test
    steps:
      - uses: actions/checkout@v4
      - run: helm version
      - name: lint
        run: helm lint "$CHART" $SECRET
      - name: render every value combination
        run: |
          helm template rel "$CHART" $SECRET >/dev/null
          helm template rel "$CHART" $SECRET \
            --set localCache.enabled=true --set localCache.sizeLimit=100Gi >/dev/null
          helm template rel "$CHART" $SECRET --set image.tag=0.2.0 >/dev/null
          helm template rel "$CHART" $SECRET \
            --set image.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111 >/dev/null
          helm template rel "$CHART" $SECRET \
            --set 'extraEnvFrom[0].secretRef.name=loonfs-server-secrets' >/dev/null
      - name: reject an unbounded local cache
        run: |
          if output="$(helm template rel "$CHART" $SECRET \
            --set localCache.enabled=true 2>&1)"; then
            echo "FAIL: enabled cache without localCache.sizeLimit rendered" >&2
            exit 1
          fi
          grep -q 'localCache.sizeLimit.*cache emptyDir.*disk_bytes' <<<"$output"
      - name: assert the single-writer settings
        run: |
          rendered="$(helm template rel "$CHART" $SECRET)"
          assert_line() {
            grep -qE "$1" <<<"$rendered" || {
              echo "FAIL: the render has no line matching $1" >&2
              exit 1
            }
            echo "ok: $1"
          }
          assert_line '^  replicas: 1$'
          assert_line '^    type: Recreate$'
          assert_line '^      automountServiceAccountToken: false$'

  dist:
    name: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dist-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-dist-
      - run: scripts/test-install-loonfs.sh
