[workspace]
resolver = "2"
members = [
  "crates/loon-api",
  "crates/loon-objectstore",
  "crates/loon-core",
  "crates/loonfs",
  "crates/loon-model",
  "crates/loon-server",
  "crates/loon-client",
  "crates/loon-cli",
  "xtask",
]

[workspace.package]
edition = "2021"
version = "0.1.1"
license = "Apache-2.0"
rust-version = "1.83"
description = "Spec-locked object-store-backed file service"
repository = "https://github.com/loonfs/loonfs"
homepage = "https://github.com/loonfs/loonfs"
keywords = ["object-storage", "files", "r2"]
categories = ["filesystem", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
aws-sdk-s3 = "=0.30.0"
base64 = "0.22"
bytes = "1"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive"] }
http = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.30"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "2.10", features = ["json"] }
urlencoding = "2"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zstd = "0.13"
