[workspace]
resolver = "2"
members = [
  "crates/loon-types",
  "crates/loon-objectstore",
  "crates/loon-core",
  "crates/loon-model",
  "crates/loon-queue",
  "crates/loon-testkit",
  "crates/loon-sim",
  "crates/loon-server",
  "crates/loon-cli",
  "crates/loon-client",
  "crates/loon-macos",
  "xtask",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
rust-version = "1.83"

[workspace.dependencies]
anyhow = "1"
aws-sdk-s3 = "=0.30.0"
ciborium = "0.2"
http = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "time"] }
zstd = "0.13"
