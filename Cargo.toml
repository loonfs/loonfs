[workspace]
resolver = "2"
members = [
  "crates/loonfs-api",
  "crates/loonfs-objectstore",
  "crates/loonfs-core",
  "crates/loonfs",
  "crates/loonfs-model",
  "crates/loonfs-server",
  "crates/loonfs-client",
  "crates/loonfs-cli",
  "crates/loonfs-sim",
]

[workspace.package]
edition = "2021"
version = "0.1.1"
license = "Apache-2.0"
rust-version = "1.85"
description = "Spec-locked object-store-backed file service"
repository = "https://github.com/loonfs/loonfs"
homepage = "https://github.com/loonfs/loonfs"
keywords = ["object-storage", "files", "r2"]
categories = ["filesystem", "command-line-utilities"]

[workspace.dependencies]
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
bytes = "1"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
crc32c = "0.6"
http = "1"
futures = "0.3"
fs4 = "0.13"
object_store = { version = "=0.12.4", default-features = false, features = ["aws", "gcp", "azure"] }
regex = { version = "1.11", default-features = false, features = ["std", "perf"] }
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "2.10", features = ["json"] }
utoipa = { version = "5.5", features = ["macros"] }
urlencoding = "2"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
