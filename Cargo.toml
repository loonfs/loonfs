[workspace]
resolver = "2"
members = [
  "crates/loonfs-api",
  "crates/loonfs-test-support",
  "crates/loonfs-grep",
  "crates/loonfs-objectstore",
  "crates/loonfs-core",
  "crates/loonfs",
  "crates/loonfs-model",
  "crates/loonfs-server",
  "crates/loonfs-client",
  "crates/loonfs-cli",
  "crates/loonfs-conformance",
  "crates/loonfs-sim",
]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "Apache-2.0"
rust-version = "1.85"
description = "Spec-locked object-store-backed file service"
repository = "https://github.com/loonfs/loonfs"
homepage = "https://github.com/loonfs/loonfs"
keywords = ["object-storage", "files", "r2"]
categories = ["filesystem", "command-line-utilities"]

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
# `serde` because the server's local block cache stores `Bytes` values through
# foyer, whose `serde` feature encodes values through their serde impls.
bytes = { version = "1", features = ["serde"] }
ciborium = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
crc32c = "0.6"
crc64fast-nvme = "1.2"
http = "1"
http-body = "1"
indexmap = { version = "2", features = ["serde"] }
# The `serde` feature makes foyer encode keys and values through their serde
# impls, which is how the server's cache key reaches foyer's storage traits.
# Pinned exactly: the cache-directory geometry code reads foyer's block-file
# naming, so a version bump is a deliberate change with its own review.
foyer = { version = "=0.22.3", features = ["serde"] }
# Named directly, though axum already carries both: the server decodes query
# strings itself so that an unknown parameter is reported the same way an
# unknown JSON body field is. `form_urlencoded` splits the query string into
# pairs and `serde_urlencoded` deserializes them.
form_urlencoded = "1"
futures = "0.3"
fs4 = "0.13"
getrandom = "0.3"
object_store = { version = "=0.12.4", default-features = false, features = ["aws", "gcp", "azure"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
regex = { version = "1.11", default-features = false, features = ["std", "perf"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
regex-syntax = "0.8"
# Already in the tree beneath rustls and rcgen. Named directly because the GCS
# presigner signs `GOOG4-RSA-SHA256` with an RSA key, which the hash and MAC
# crates this workspace already carries cannot do.
ring = "0.17"
# `ring`, not the crate default `aws-lc-rs`: the rustls stack is already in
# the tree as a transitive dependency built on ring, and the default provider
# would pull a second, native-toolchain crypto backend in beside it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"
serde_urlencoded = "0.7"
sha2 = "0.10"
hmac = "0.12"
loonfs-model = { path = "crates/loonfs-model" }
loonfs-test-support = { path = "crates/loonfs-test-support" }
# Cargo requires published dependencies to include a registry version even
# when they also have a local path. These versions must match
# `workspace.package.version`.
loonfs = { path = "crates/loonfs", version = "0.3.0" }
loonfs-api = { path = "crates/loonfs-api", version = "0.3.0" }
loonfs-client = { path = "crates/loonfs-client", version = "0.3.0" }
loonfs-core = { path = "crates/loonfs-core", version = "0.3.0" }
loonfs-grep = { path = "crates/loonfs-grep", version = "0.3.0" }
loonfs-objectstore = { path = "crates/loonfs-objectstore", version = "0.3.0" }
# foyer reports its internal counters through this registry trait and does not
# re-export it, so a host that wants to read them names the crate itself. The
# version must stay the one foyer resolves, or the trait this workspace
# implements is a different trait than the one foyer accepts.
mixtrics = "0.2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "2.10", features = ["json"] }
utoipa = { version = "5.5", features = ["macros"] }
urlencoding = "2"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
zstd = "0.13"

[profile.dev]
# Tests inherit this profile. Line tables are everything a backtrace or a
# panic location needs; the rest of the debug info only costs link time and
# disk.
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
exit = "warn"
unreachable = "warn"
print_stdout = "warn"
print_stderr = "warn"
