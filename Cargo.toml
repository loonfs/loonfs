[workspace]
resolver = "2"
members = [
  "crates/loon-api",
  "crates/loon-objectstore",
  "crates/loon-core",
  "crates/loon-model",
  "crates/loon-server",
  "crates/loon-client",
  "crates/loon-cli",
  "crates/loon-testkit",
  "xtask",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
rust-version = "1.83"
description = "Spec-locked object-store-backed file service"
repository = "https://github.com/prequel-co/loonfs"
homepage = "https://github.com/prequel-co/loonfs"
keywords = ["object-storage", "files", "r2"]
categories = ["filesystem", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
aws-sdk-s3 = "=0.30.0"
bytes = "1"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive"] }
http = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
ureq = { version = "2.10", features = ["json"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zstd = "0.13"
