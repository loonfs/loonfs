[workspace]
resolver = "2"
members = [
  "crates/loonfs-types",
  "crates/loonfs-test-support",
  "crates/loonfs-grep",
  "crates/loonfs-objectstore",
  "crates/loonfs-core",
  "crates/loonfs",
  "crates/loonfs-model",
  "crates/loonfs-http",
  "crates/loonfs-server",
  "crates/loonfs-client",
  "crates/loonfs-cli",
  "crates/loonfs-conformance",
  "crates/loonfs-sim",
]

[workspace.package]
edition = "2021"
version = "0.4.0"
license = "Apache-2.0"
rust-version = "1.99"
description = "Spec-locked object-store-backed file service"
repository = "https://github.com/loonfs/loonfs"
homepage = "https://github.com/loonfs/loonfs"

[workspace.dependencies]
async-trait = "0.1"
# The standard AWS credentials chain (`DefaultCredentialsChain`), which brings 18 `aws-*` crates.
aws-config = { version = "1.8.1", default-features = false, features = ["credentials-process", "rt-tokio", "rustls", "sso"] }
aws-credential-types = "1.2.3"
aws-types = "1.3.7"
axum = "0.8"
base64 = "0.22"
# `serde` because the server's local block cache stores `Bytes` values through
# foyer, whose `serde` feature encodes values through their serde impls.
bytes = { version = "1", features = ["serde"] }
# CBOR, the encoding of WAL payloads and segment rows.
ciborium = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
# CRC-32C for durable block checksums, and CRC-64/NVME for the checksum
# S3-compatible providers compute over a multipart object. It also combines
# CRCs, so the CRC of an appended object follows from the CRCs of its parts.
crc-fast = "1.8"
# The CLI's interactive prompts. It brings `thiserror` 1.x beside the workspace's 2.x.
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
hostname = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1.0.3"
hyper = "1"
hyper-util = "0.1"
# Pinned exactly: name keys fold with this version's Unicode 17.0.0 data
# (format.md, "Names and paths"), so a version bump is a format change.
icu_casemap = "=2.1.1"
icu_normalizer = "=2.1.1"
libc = "0.2"
# The `serde` feature makes foyer encode keys and values through their serde
# impls, which is how the server's cache key reaches foyer's storage traits.
# Pinned exactly: the cache-directory geometry code reads foyer's block-file
# naming, so a version bump is a deliberate change with its own review.
foyer = { version = "=0.22.3", features = ["serde"] }
# Named directly, though axum already carries both: the server decodes query
# strings itself so that an unknown parameter is reported the same way an
# unknown JSON body field is. `form_urlencoded` splits the query string into
# pairs and `serde_urlencoded` deserializes them. The client encodes its query
# values with `form_urlencoded` too.
form_urlencoded = "1"
futures = "0.3"
# Cross-process file locks for the local store, the CLI's config and upload
# journal, and the server's cache directory.
fs4 = "0.13"
getrandom = "0.3"
object_store = { version = "0.14.2", default-features = false, features = ["aws", "gcp"] }
# Self-signed certificates for the TLS tests.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
regex = { version = "1.11", default-features = false, features = ["std", "perf"] }
# `rustls-no-provider` because the client builds its own TLS configuration
# (`reqwest_transport.rs`), and reqwest's `rustls` feature would add the
# aws-lc-rs provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
regex-syntax = "0.8"
# Already in the tree beneath rustls and rcgen. Named directly because the GCS
# presigner signs `GOOG4-RSA-SHA256` with an RSA key, which the hash and MAC
# crates this workspace already carries cannot do.
ring = "0.17"
# `ring` because the server's TLS listener (`http/tls.rs`) and the client's
# TLS configuration (`reqwest_transport.rs`) name the ring provider.
# `aws-lc-rs` is also in the tree, through object_store and aws-config.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The operating system's root certificates, which the client trusts beside
# `ca_cert_path`. Already in the tree beneath aws-config's HTTP client.
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"
serde_urlencoded = "0.7"
sha2 = "0.10"
hmac = "0.12"
loonfs-model = { path = "crates/loonfs-model" }
loonfs-test-support = { path = "crates/loonfs-test-support" }
# Cargo requires published dependencies to include a registry version even
# when they also have a local path. These versions must match
# `workspace.package.version`.
loonfs = { path = "crates/loonfs", version = "0.4.0" }
loonfs-client = { path = "crates/loonfs-client", version = "0.4.0" }
loonfs-core = { path = "crates/loonfs-core", version = "0.4.0" }
loonfs-grep = { path = "crates/loonfs-grep", version = "0.4.0" }
loonfs-http = { path = "crates/loonfs-http", version = "0.4.0" }
loonfs-objectstore = { path = "crates/loonfs-objectstore", version = "0.4.0" }
loonfs-types = { path = "crates/loonfs-types", version = "0.4.0" }
# foyer reports its internal counters through this registry trait and does not
# re-export it, so a host that wants to read them names the crate itself. The
# version must stay the one foyer resolves, or the trait this workspace
# implements is a different trait than the one foyer accepts.
mixtrics = "0.2"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# A blocking client for tests that send raw HTTP requests and read the raw
# response, outside the typed client.
ureq = { version = "2.10", default-features = false, features = ["json"] }
# Generates `openapi.json` from the API types.
utoipa = { version = "5.5", features = ["macros"] }
walkdir = "2"
# XXH64, the hash of the durable Bloom filters and of grep cursor fingerprints.
xxhash-rust = { version = "0.8", features = ["xxh64"] }
zstd = "0.13"

[profile.dev]
# Tests inherit this profile. Line tables are everything a backtrace or a
# panic location needs; the rest of the debug info only costs link time and
# disk.
debug = "line-tables-only"

# Every durable object is zstd-compressed and SHA-256 checksummed. Unoptimized,
# those two dominate the tests that write large segments; optimized, they
# rebuild in seconds and leave the rest of the dev build untouched.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.zstd-sys]
opt-level = 3

[workspace.lints.rust]
# The clock_gettime boundary in loonfs-types needs one local unsafe allowance.
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
exit = "warn"
unreachable = "warn"
print_stdout = "warn"
print_stderr = "warn"
too_long_first_doc_paragraph = "warn"
