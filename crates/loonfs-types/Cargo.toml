[package]
name = "loonfs-types"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared LoonFS types: validated ids and paths, HTTP API shapes, and durable-format codecs."
repository.workspace = true
homepage.workspace = true
keywords = ["filesystem", "object-storage", "wire-format", "openapi"]
categories = ["filesystem"]

[dependencies]
base64.workspace = true
ciborium.workspace = true
# Durable-format checksums: the algorithm choice is a frozen format constant
# (docs/design/metadata-block-storage.md).
crc-fast.workspace = true
# Content ids are 128 fully random bits, drawn straight from the system
# generator (see `ids::ContentId`).
getrandom.workspace = true
hmac.workspace = true
# Parses config URLs into `Uri` for the shared config field checks.
http.workspace = true
icu_casemap.workspace = true
icu_normalizer.workspace = true
libc.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
# `compress` exposes the block function, which continues a digest from a
# recorded state.
sha2.workspace = true
thiserror.workspace = true
utoipa = { workspace = true, optional = true }
xxhash-rust.workspace = true
zstd.workspace = true

[features]
openapi = ["dep:utoipa"]

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["serde_bytes"]
