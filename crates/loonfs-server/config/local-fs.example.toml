bind = "127.0.0.1:9400"
# auth_token and content_token_secret may instead come from the
# LOONFS_AUTH_TOKEN and LOONFS_CONTENT_TOKEN_SECRET environment variables;
# a non-blank value in this file takes precedence over the environment.
# A non-loopback bind refuses to load without auth_token unless
# allow_unauthenticated_remote = true is set explicitly.
auth_token = "dev-token"
content_token_secret = "dev-content-token-secret"
writer_id = "loonfs-server-local"
# Maximum WAL folds this server runs at once. A sustained
# `loonfs.execution_budget.folds_waiting` gauge means the cap is too low.
# Defaults to 2.
#max_concurrent_folds = 2

# Maximum metadata merges this server runs at once, bounded compaction steps
# and streaming compactions alike. Each holds up to max_merge_input_bytes of
# decoded input. Defaults to 2.
#max_concurrent_compactions = 2

# Minimum interval between publication starts per namespace; cold namespaces
# publish immediately. Defaults to 1000 ms.
#min_publish_interval_ms = 1000

# Metadata and query request deadline; streamed content and long-running
# operator work are exempt. Defaults to 60000 ms.
#request_deadline_ms = 60000

# Terminating TLS in this process. Uncomment the [tls] table at the bottom of
# this file to turn it on. A non-loopback bind refuses to load without it,
# because the wire carries the bearer token and the presigned object-store
# URLs the upload routes hand back. Set this instead when TLS terminates in
# front of LoonFS — a load balancer, an ingress controller, a sidecar.
#allow_remote_without_tls = true

# Whether this server serves the maintenance API group, runs the maintenance
# sweep, both, or neither. `serve_and_maintain` is the default. The other
# values are `serve_only`, `maintain_only`, and `disabled`. A mode that does
# not serve the group answers its routes with `route_not_found`; a mode that
# does not maintain leaves background work to another process. The sweep
# visits sessions this process wrote to and periodically every namespace in
# the store. It folds idle WAL tails, compacts metadata, builds the grep index,
# and collects garbage.
#maintenance = "serve_and_maintain"

# Largest request body accepted for service-proxied upload content, in
# bytes. The server never holds the body whole. It forwards one transfer
# part at a time while counting the bytes. Advertised to clients as the
# `upload.service_proxied.max_content_bytes` capability limit. Defaults to 256 MiB.
#max_upload_bytes = 268435456

# Largest file content a service-proxied read will stream and return, in
# bytes; over-limit reads answer `content_too_large`. Advertised to clients
# as the `download.service_proxied.max_content_bytes` capability limit. Defaults to 256 MiB.
#max_download_bytes = 268435456

# Snapshot request ttl, total lifetime from creation, and live quota per
# namespace. These are advertised through the matching `snapshot.*` limits.
#snapshot_max_ttl_ms = 86400000
#snapshot_max_lifetime_ms = 604800000
#snapshot_max_live_per_namespace = 16

# How many proxied upload bodies the server will stream at once and how many
# content streams it will serve at once. Requests past a cap answer 503
# `server_busy`. Upload memory tracks at most one 8 MiB transfer part per
# admitted body. Download memory tracks one 8 MiB read chunk per admitted
# stream.
#max_concurrent_uploads = 8
#max_concurrent_downloads = 16

# How many namespaces the maintenance sweep visits at once. Defaults to 8.
#max_concurrent_maintenance = 8

# Milliseconds from the start of one session pass to the start of the next. A
# pass that runs longer is followed at once. Defaults to 300000 (5 minutes).
#maintenance_interval_ms = 300000

# Least milliseconds between session passes that collect garbage for sessions
# whose published seq moved. Defaults to 3600000 (1 hour).
#gc_interval_ms = 3600000

# Milliseconds between full passes over every namespace, with collection.
# The first runs at start. Defaults to 86400000 (24 hours). An idle namespace
# costs no request between full passes.
#full_sweep_interval_ms = 86400000

# Close a caught-up session when its last open is older than this many
# milliseconds and no request holds a clone. Must be positive. Defaults to
# 1800000 (30 minutes). Each held session keeps its publisher, engine state,
# head position, and queue capacities. A write after close opens a new session
# whose first publish acquires a new writer epoch.
#idle_session_close_after_ms = 1800000

# Decoded metadata bytes one maintenance step may merge. A step merges only
# the runs that fit; a larger window runs as a streaming compaction that holds
# at most this much at once. Defaults to 64 MiB.
#max_merge_input_bytes = 67108864

# Minimum interval between checks for a successor to a cached manifest, in
# milliseconds. Zero checks on every read. Defaults to 1000.
#manifest_revalidation_interval_ms = 1000

# Metadata blocks one read, publication, or fold keeps for itself on top of
# the metadata cache. Zero keeps none. Defaults to 64 MiB.
#max_block_memo_bytes = 67108864

# How old a namespace's newest commit must be before maintenance folds a WAL
# tail that is below the fold thresholds, in milliseconds. The maintenance
# sweep and explicit `metadata` requests use the same period. Zero turns the
# rule off. Defaults to 900000 (15 minutes).
#idle_fold_after_ms = 900000

# Direct-put needs no configuration. It is offered only where the adapter can
# presign a create-only PUT and report a durable checksum, and the endpoint is
# a first-party AWS S3 or Cloudflare R2 domain, so it is unavailable on this
# local-fs store.
# Clients gate on `filesystem.uploads.direct_put` in the capability document.

# Limits of the one metadata cache this server reads through; omitted fields
# keep the runtime defaults. `max_segment_bytes` holds decoded metadata
# blocks and manifests. Defaults to 256 MiB. `max_head_state_bytes` holds
# namespace head anchors and WAL-tail projections, the tails the writer's
# namespace publishers publish from included, with no limit on how many
# namespaces stay cached. Defaults to 64 MiB. Neither bounds writer sessions:
# the server keeps one for each namespace it has written since it started.
#[metadata_cache]
#max_segment_bytes = 268435456
#max_head_state_bytes = 67108864

# Optional node-local cache of encoded metadata blocks, on this machine's own
# disk. Omit the table and there is none: every metadata block the decoded
# cache misses is read from object storage.
#
# The directory is this server's alone while it runs — a second server
# pointed at it fails to start — and it holds nothing durable. Object storage
# stays the authority for every block, so the directory can be deleted
# whenever this server is stopped, and it is rebuilt on the next start.
#
# `disk_bytes` is claimed up front in 16 MiB files under `path`, each held
# open, so the value below asks for 6400 files and an open-file limit above
# that. Six files is the smallest tier that may be configured; anything
# under 100663296 is refused. Raising the value across a restart keeps what
# the directory already holds, and lowering it starts the directory empty
# rather than leaving the files it no longer claims behind. Nothing else
# about the tier is configurable: how it is laid out on disk, how many
# flushers write it, and how large its write buffers are are engine-tuning
# numbers rather than deployment decisions.
#[local_cache]
#path = "/var/lib/loonfs/cache"
#memory_bytes = 67108864
#disk_bytes = 107374182400

# Omit the `[grep]` table and this server composes no grep at all: uniform
# `not_supported` responses, and no `query.grep` feature or limits advertised.
# A `[grep]` table must set `mode`.
# `serve_only` answers searches over an index another process maintains;
# `maintain_only` maintains the index without answering searches; `disabled`
# turns both off again.
#[grep]
#mode = "serve_and_maintain"
# Bounded indexing input budgets; every value must be greater than zero.
#max_files_per_step = 256
#max_content_bytes_per_step = 67108864
# How many index build and reorganize steps hold file content or index
# segments at once, across every namespace. Indexing memory peaks at this
# many steps of `max_content_bytes_per_step`, whatever
# `max_concurrent_maintenance` is. Must be greater than zero. Defaults to 2.
#max_concurrent_steps = 2
# Segment layout and merge policy use engine defaults.

# The server's TLS identity, read once at startup: a file that is missing or
# is not the PEM it claims to be fails the process rather than falling back
# to plaintext. The chain is leaf first; the key may be PKCS#8, RSA, or EC.
# Clients then use an https:// server URL, and a client that must trust a
# private CA points at its bundle with `ca_cert_path`.
#[tls]
#cert_path = "/etc/loonfs/tls/server.crt"
#key_path = "/etc/loonfs/tls/server.key"

[store]
kind = "local-fs"
root = "./.loonfs-store"
key_prefix = "local-demo"

# Shared publication admission. Includes active requests, duplicate callers,
# and namespace deletes. Full admission returns `commit_queue_full`.
#[publication]
#max_requests = 8192
#max_requests_per_namespace = 1024
#max_estimated_bytes = 67108864
#max_estimated_bytes_per_namespace = 8388608
#max_concurrent_publications = 8
