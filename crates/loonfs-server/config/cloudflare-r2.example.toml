bind = "127.0.0.1:9400"
content_token_secret = "dev-content-token-secret"
writer_id = "loonfs-server-r2"
# Derive memory pools from 4 GiB. Omit this to use the Linux cgroup limit.
memory_limit_bytes = 4294967296
#manifest_revalidation_interval_ms = 1000
#max_staleness_ms = 1000
#consistency = "eventual"
# Keep 30 days of history for each namespace without a retention window of
# its own, and advance its retention floor past older history on each full
# maintenance pass. Omit it to advance only the floors of namespaces that
# have their own window.
#retention_window_ms = 2592000000

# Requests authenticate with this bearer token. The token may instead come
# from LOONFS_AUTH_TOKEN.
[auth]
kind = "bearer_token"
token = "dev-token"

# Serving beyond loopback requires TLS. Either terminate it here with the PEM
# chain (leaf first) and its private key, read once at startup, or set
# `kind = "plaintext_behind_proxy"` when a proxy in front of LoonFS
# terminates it.
#[transport]
#kind = "tls"
#cert_path = "/etc/loonfs/tls/server.crt"
#key_path = "/etc/loonfs/tls/server.key"

[store]
kind = "cloudflare_r2"
bucket = "your-bucket"
account_id = "YOUR_ACCOUNT_ID"
endpoint_url = "https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com"
key_prefix = "loonfs-demo"

# Static credentials are stored in this file.
[store.credentials]
kind = "static"
access_key_id = "YOUR_ACCESS_KEY_ID"
secret_access_key = "YOUR_SECRET_ACCESS_KEY"
