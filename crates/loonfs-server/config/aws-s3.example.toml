bind = "127.0.0.1:9400"
content_token_secret = "dev-content-token-secret"
writer_id = "loonfs-server-aws"
# Derive memory budgets from 4 GiB. Omit this to use the Linux cgroup limit.
memory_limit_bytes = 4294967296
#manifest_revalidation_interval_ms = 1000
#max_staleness_ms = 1000
#consistency = "eventual"
# Record a 30-day retention window in each namespace that the server creates
# without a window of its own. Each maintenance sweep advances a namespace's
# retention floor past the history older than the namespace's window. Omit it
# to create such namespaces without a window.
#retention_window_ms = 2592000000

# Requests authenticate with this bearer token. The token may instead come
# from LOONFS_AUTH_TOKEN.
[auth]
kind = "bearer_token"
token = "dev-token"

# Serving beyond loopback requires TLS. Either terminate it here with the PEM
# chain (leaf first) and its private key, read once at startup, or set
# `kind = "plaintext_behind_proxy"` when a proxy in front of LoonFS
# terminates it.
#[transport]
#kind = "tls"
#cert_path = "/etc/loonfs/tls/server.crt"
#key_path = "/etc/loonfs/tls/server.key"

[store]
kind = "aws_s3"
bucket = "your-bucket"
region = "us-east-1"
# endpoint_url is optional for AWS S3. If you set a custom endpoint with
# force_path_style = false, LoonFS accepts either a bucket-specific endpoint
# like "https://your-bucket.s3.us-east-1.amazonaws.com" or a bucket-less
# regional endpoint like "https://s3.us-east-1.amazonaws.com".
key_prefix = "loonfs-demo"
force_path_style = false

# Uses the standard AWS SDK credential chain, including environment variables,
# named configurations, SSO, web identity, and AWS compute roles. Temporary credentials
# refresh automatically.
[store.credentials]
kind = "ambient"

# To use static credentials instead:
# [store.credentials]
# kind = "static"
# access_key_id = "YOUR_ACCESS_KEY_ID"
# secret_access_key = "YOUR_SECRET_ACCESS_KEY"
# session_token = "YOUR_SESSION_TOKEN" # optional
