bind = "127.0.0.1:9400"
content_token_secret = "dev-content-token-secret"
writer_id = "loonfs-server-gcp"
# Derive memory budgets from 4 GiB. Omit this to use the Linux cgroup limit.
memory_limit_bytes = 4294967296
#manifest_revalidation_interval_ms = 1000
#max_staleness_ms = 1000
# Record a 30-day retention window in each namespace that the server creates
# without a window of its own. Each maintenance sweep advances a namespace's
# retention floor past the history older than the namespace's window. Omit it
# to create such namespaces without a window.
#retention_window_ms = 2592000000

# Requests authenticate with this bearer token. The token may instead come
# from LOONFS_AUTH_TOKEN.
[auth]
kind = "bearer_token"
token = "dev-token"

# Serving beyond loopback requires TLS. Either terminate it here with the PEM
# chain (leaf first) and its private key, read once at startup, or set
# `kind = "plaintext_behind_proxy"` when a proxy in front of LoonFS
# terminates it.
#[transport]
#kind = "tls"
#cert_path = "/etc/loonfs/tls/server.crt"
#key_path = "/etc/loonfs/tls/server.key"

[store]
kind = "gcp_gcs"
bucket = "your-bucket"
key_prefix = "loonfs-demo"

# The provider client authenticates with this key, and its RSA private key
# also signs the direct upload and download URLs handed to clients. The
# service account therefore needs object read and create rights on the
# bucket, plus the ability to sign, which for a downloaded service-account
# key it has by holding the key. Startup fails if the file cannot sign.
[store.credentials]
kind = "service_account_file"
path = "/path/to/service-account.json"

# To run without a key file in this config, use the credentials the
# environment provides: a service-account key or authorized-user file that
# GOOGLE_APPLICATION_CREDENTIALS points to, the gcloud application default
# credentials, or the metadata server of the VM or pod (workload identity).
# A workload identity federation file is not supported. Direct upload and
# download URLs are signed through the IAM Credentials API as the service
# account those credentials resolve to, one signBlob request per URL, so the
# service account needs the Service Account Token Creator role
# (roles/iam.serviceAccountTokenCreator) on itself. An authorized-user file,
# such as gcloud's, can't sign this way, so a store built from one offers no
# direct transfers. On GKE, the Kubernetes ServiceAccount linked to the
# service account also needs the annotation
# iam.gke.io/return-principal-id-as-email="true", so that the metadata server
# reports the service account's email.
# [store.credentials]
# kind = "ambient"
