bind = "127.0.0.1:9400"
auth_token = "dev-token"
content_token_secret = "dev-content-token-secret"
writer_id = "loonfs-server-gcp"

# Serving beyond loopback requires TLS. Either terminate it here by
# uncommenting [tls] below, or set allow_remote_without_tls = true when a
# proxy in front of LoonFS terminates it.
#allow_remote_without_tls = true

# PEM chain (leaf first) and its private key, read once at startup.
#[tls]
#cert_path = "/etc/loonfs/tls/server.crt"
#key_path = "/etc/loonfs/tls/server.key"

[store]
kind = "gcp-gcs"
bucket = "your-bucket"
# The provider client authenticates with this key, and its RSA private key
# also signs the direct upload and download URLs handed to clients. The
# service account therefore needs object read and create rights on the
# bucket, plus the ability to sign — which for a downloaded service-account
# key it has by holding the key. Startup fails if the file cannot sign.
key_prefix = "loonfs-demo"

[store.credentials]
kind = "service-account-file"
path = "/path/to/service-account.json"
