[package]
name = "loonfs-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The reference LoonFS HTTP server."
repository.workspace = true
# The server ships as an image and as binaries, not as a library.
publish = false

[[bin]]
name = "loonfs-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
futures.workspace = true
http-body.workspace = true
http.workspace = true
loonfs-types.workspace = true
loonfs.workspace = true
loonfs-grep.workspace = true
loonfs-http.workspace = true
loonfs-objectstore.workspace = true
rustls.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
async-trait.workspace = true
bytes.workspace = true
form_urlencoded.workspace = true
http-body-util.workspace = true
loonfs = { workspace = true, features = ["test-support"] }
loonfs-client.workspace = true
loonfs-core = { workspace = true, features = ["test-support"] }
loonfs-test-support.workspace = true
rcgen.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }
ureq.workspace = true

[lints]
workspace = true
