[package]
name = "loonfs-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The reference LoonFS HTTP server."
repository.workspace = true

[[bin]]
name = "loonfs-server"
path = "src/main.rs"

[[bin]]
name = "loonfs-openapi"
path = "src/bin/loonfs-openapi.rs"
required-features = ["openapi"]

[dependencies]
axum.workspace = true
bytes.workspace = true
clap.workspace = true
http.workspace = true
loonfs-api = { path = "../loonfs-api" }
loonfs-core = { path = "../loonfs-core" }
loonfs = { path = "../loonfs" }
loonfs-objectstore = { path = "../loonfs-objectstore" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
futures.workspace = true
loonfs-client = { path = "../loonfs-client" }
tempfile.workspace = true
ureq.workspace = true

[features]
openapi = ["dep:utoipa", "loonfs-api/openapi"]

[lints]
workspace = true
