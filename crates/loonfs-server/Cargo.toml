[package]
name = "loonfs-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The reference LoonFS HTTP server."
repository.workspace = true
# The server ships as an image and as binaries, not as a library.
publish = false

[[bin]]
name = "loonfs-server"
path = "src/main.rs"

[[bin]]
name = "loonfs-openapi"
path = "src/bin/loonfs-openapi.rs"
required-features = ["openapi"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
foyer.workspace = true
fs4.workspace = true
futures.workspace = true
http.workspace = true
loonfs-api.workspace = true
loonfs.workspace = true
loonfs-grep.workspace = true
loonfs-objectstore.workspace = true
mixtrics.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
loonfs-client.workspace = true
loonfs-test-support = { path = "../loonfs-test-support" }
rcgen.workspace = true
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
ureq.workspace = true

[features]
openapi = ["dep:utoipa", "loonfs-api/openapi"]

[lints]
workspace = true
