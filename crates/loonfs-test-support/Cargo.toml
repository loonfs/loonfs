[package]
name = "loonfs-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Shared test helpers for LoonFS crates."
repository.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
loonfs-api = { path = "../loonfs-api" }
loonfs-objectstore = { path = "../loonfs-objectstore" }
tempfile.workspace = true
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
ureq.workspace = true

[dev-dependencies]
# `test-util` gives the gate's own tests a paused clock, so they can hold a
# parked operation far longer than any deadline without costing wall time.
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
    "sync",
    "test-util",
    "time",
] }

[lints]
workspace = true
