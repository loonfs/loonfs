[package]
name = "loonfs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core LoonFS engine: namespace metadata, commits, replay, and maintenance."
repository.workspace = true

[dependencies]
loonfs-api = { path = "../loonfs-api" }
loonfs-objectstore = { path = "../loonfs-objectstore" }
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
hmac.workspace = true
sha2.workspace = true
thiserror.workspace = true
# sync-only: single-flight primitives; core stays executor-agnostic.
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing.workspace = true

[features]
default = []

[dev-dependencies]
loonfs-model = { path = "../loonfs-model" }
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
