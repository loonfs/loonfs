[package]
name = "loonfs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core LoonFS engine: namespace metadata, commits, replay, and maintenance."
repository.workspace = true
homepage.workspace = true
keywords = ["filesystem", "object-storage", "wal", "metadata"]
categories = ["filesystem"]

[dependencies]
loonfs-types.workspace = true
loonfs-objectstore.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# `sync` for single-flight primitives and `macros` for `select!`. Core never
# spawns, so it stays executor-agnostic.
tokio = { workspace = true, features = ["macros", "sync"] }
tracing.workspace = true
xxhash-rust.workspace = true

[features]
# Test helpers for the test targets of other crates. No production build
# enables it.
test-support = []

[dev-dependencies]
loonfs-model.workspace = true
loonfs-test-support.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "test-util"] }
zstd.workspace = true

# The integration harness uses this crate's test-support helpers, which a bare
# `cargo test -p loonfs-core` does not enable; declaring the requirement makes
# that invocation skip the target instead of failing to compile it. Workspace
# runs still execute it because `loonfs`'s dev-dependencies enable the feature.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["test-support"]

[lints]
workspace = true
