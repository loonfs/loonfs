[package]
name = "loonfs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The LoonFS command-line interface."
repository.workspace = true
readme = "README.md"

[[bin]]
name = "loonfs"
path = "src/main.rs"

[dependencies]
bytes.workspace = true
clap.workspace = true
futures.workspace = true
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
hostname = "0.4"
http.workspace = true
loonfs-api = { path = "../loonfs-api" }
loonfs-client = { path = "../loonfs-client" }
loonfs = { path = "../loonfs" }
loonfs-grep = { path = "../loonfs-grep" }
loonfs-objectstore = { path = "../loonfs-objectstore" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# `io-std` is what makes standard input an asynchronous source, which is
# how `loonfs put -` reads a payload of unknown length.
tokio = { workspace = true, features = ["io-std"] }
toml.workspace = true
walkdir.workspace = true

[dev-dependencies]
ureq.workspace = true
insta = { version = "1.39", features = ["json"] }
# The store wrappers that make "this transfer never held the file" a
# checkable claim rather than a comment.
loonfs-test-support = { path = "../loonfs-test-support" }

[lints]
workspace = true
