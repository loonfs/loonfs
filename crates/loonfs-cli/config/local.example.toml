# Example LoonFS CLI configuration for a local embedded profile.
# `loonfs init` writes this file, and `loonfs config path` prints where the
# CLI reads it from.

config_version = 1
default_profile = "local"

[profiles.local]
mode = "embedded"
writer_id = "example-local-writer"

[profiles.local.store]
kind = "local-fs"
root = "./.loonfs-store"
key_prefix = "local-example"
