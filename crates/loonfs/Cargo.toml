[package]
name = "loonfs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Embedded LoonFS runtime: a durable, agent-native filesystem on object storage."
repository.workspace = true
homepage.workspace = true
keywords = ["filesystem", "object-storage", "s3", "embedded"]
categories = ["filesystem"]

[dependencies]
# The SSD tier implements the core segment block cache trait.
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
loonfs-types.workspace = true
loonfs-core.workspace = true
loonfs-objectstore.workspace = true
serde.workspace = true
# The SSD tier's disk key.
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[features]
# Test hooks of the SSD tier, for the test targets of this crate and others.
# No production build enables it.
test-support = []

[dev-dependencies]
# Core's test helpers live behind its `test-support` feature, and test
# targets are the only builds that turn it on.
loonfs-core = { workspace = true, features = ["test-support"] }
# This crate's own test hooks, for its integration tests.
loonfs = { path = ".", features = ["test-support"] }
loonfs-test-support.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
