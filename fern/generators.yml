# SDK generation configuration. Versions are pinned; regeneration is local
# (docker) and must not depend on a hosted project. Validated against the
# spec on 2026-08-19; see docs/specs/openapi.json for the source document.
api:
  specs:
    - openapi: ../docs/specs/openapi.json
groups:
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.57.2
        config:
          module:
            path: github.com/loonfs/loonfs-sdk-go
        output:
          location: local-file-system
          path: ./generated/go
  python:
    generators:
      - name: fernapi/fern-python-sdk
        version: 5.28.0
        output:
          location: local-file-system
          path: ./generated/python
  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.88.0
        output:
          location: local-file-system
          path: ./generated/typescript
