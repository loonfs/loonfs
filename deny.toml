# `cargo deny check bans` fails when the build has two versions of one crate.
# Each `skip` entry allows one duplicate and names the crates that pull it.

[graph]
# The targets the release builds. Windows-only and UEFI-only duplicates
# (`windows-sys`, `r-efi`) never reach a shipped binary.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[bans]
multiple-versions = "deny"
skip = [
    { crate = "thiserror@1", reason = "dialoguer 0.11 uses thiserror 1, and the workspace uses 2" },
    { crate = "thiserror-impl@1", reason = "the derive behind dialoguer's thiserror 1" },
    { crate = "base64@0.23", reason = "object_store 0.14 and reqwest 0.13 use base64 0.23, and the workspace, hyper-util, pem, and ureq use 0.22" },
    { crate = "getrandom@0.2", reason = "ring 0.17 uses getrandom 0.2" },
    { crate = "getrandom@0.4", reason = "rand 0.10 (through object_store) and tempfile use getrandom 0.4, and the workspace uses 0.3" },
    { crate = "digest@0.11", reason = "object_store's md-5 0.11 and aws-sigv4's sha2 0.11 and hmac 0.13 use digest 0.11, and crc-fast and the workspace's sha2 and hmac use 0.10" },
    { crate = "block-buffer@0.12", reason = "digest 0.11, through object_store's md-5 and aws-sigv4's sha2 and hmac" },
    { crate = "crypto-common@0.2", reason = "digest 0.11, through object_store's md-5 and aws-sigv4's sha2 and hmac" },
    { crate = "cpufeatures@0.3", reason = "chacha20 0.10 (through object_store's rand 0.10) and aws-sigv4's sha2 0.11 use cpufeatures 0.3, and sha2 0.10 uses 0.2" },
    { crate = "sha2@0.11", reason = "aws-sigv4, behind aws-config, uses sha2 0.11, and the workspace uses 0.10" },
    { crate = "hmac@0.13", reason = "aws-sigv4, behind aws-config, uses hmac 0.13, and the workspace uses 0.12" },
    { crate = "syn@3", reason = "async-trait 0.1.92 uses syn 3, and every other proc macro in the tree uses syn 2" },
]
