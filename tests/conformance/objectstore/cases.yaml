schema_version: 1
name: objectstore_active_contract_cases
cases:
  - id: create_if_absent
    summary: create-if-absent rejects second writer and preserves first bytes
  - id: compare_and_swap_stale_reject
    summary: stale compare token is rejected after a successful overwrite
  - id: compare_and_swap_missing_object_reject
    summary: compare-and-swap on a missing object fails as precondition_failed
  - id: overwrite_visibility_and_head_freshness
    summary: overwrite publishes new bytes immediately and head reflects the latest version
  - id: delete_idempotent
    summary: deleting a missing object succeeds and head stays absent
  - id: list_visibility_after_write_and_delete
    summary: list_prefix reflects immediate write and delete visibility
  - id: sorted_list_prefix
    summary: list_prefix is returned in sorted order at the trait boundary
  - id: range_read_and_invalid_range
    summary: range reads return exact bytes and reject invalid ranges
  - id: invalid_key_and_traversal_rejection
    summary: invalid keys are rejected consistently across head/get/put/delete/list_prefix
  - id: scoped_key_prefixing
    summary: scoped providers do not leak objects outside the configured prefix
