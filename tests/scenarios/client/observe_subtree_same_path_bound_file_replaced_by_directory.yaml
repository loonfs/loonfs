schema_version: 1
scenario_kind: client
name: observe_subtree_same_path_bound_file_replaced_by_directory

initial:
  namespace_id: ns-1
  bound_directories:
    - inode_id: 1
      parent_inode_id:
      display_name: ""
      relative_path: ""
      exists_on_disk: true
      dirty: false
  bound_files:
    - inode_id: 42
      parent_inode_id: 1
      display_name: notes
      relative_path: notes
      remote_content_digest: sha256:notes-v1
      local_content_digest: sha256:notes-v1
      sync_anchor_content_digest: sha256:notes-v1

observe_subtree:
  relative_path: ""
  present_entries:
    - kind: dir
      relative_path: ""
    - kind: dir
      relative_path: notes
    - kind: file
      relative_path: notes/todo.txt
      content_digest: sha256:todo-v1

expect:
  bound_delete_count: 1
  local_only_observe_count: 2
  planned_decisions:
    delete_file: 1
    create_remote_dir: 1
    no_op: 1
