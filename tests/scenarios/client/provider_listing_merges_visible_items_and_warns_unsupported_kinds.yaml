name: provider_listing_merges_visible_items_and_warns_unsupported_kinds
summary: >
  A namespace listing merges bound materialized items, local-only items, and
  remote-only placeholders while omitting unsupported symlink or mount entries
  and surfacing them as explicit warnings.
initial:
  namespace_id: provider-ns
  visible_items:
    - kind: bound
      inode_kind: file
      relative_path: bound.txt
      materialization_state: materialized
    - kind: local_only
      inode_kind: file
      relative_path: draft.txt
      materialization_state: materialized
    - kind: remote_only
      inode_kind: file
      relative_path: remote.txt
      materialization_state: placeholder
    - kind: remote_only
      inode_kind: symlink
      relative_path: alias
expect:
  listed_relative_paths:
    - bound.txt
    - draft.txt
    - remote.txt
  warnings:
    - relative_path: alias
      reason: unsupported_inode_kind
