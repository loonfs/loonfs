schema_version: 1
scenario_kind: client
name: observe_subtree_directory_move_requires_explicit_observe_move

initial:
  namespace_id: ns-1
  bound_directories:
    - inode_id: 1
      parent_inode_id:
      display_name: ""
      relative_path: ""
      exists_on_disk: true
      dirty: false
    - inode_id: 7
      parent_inode_id: 1
      display_name: docs
      relative_path: docs
      exists_on_disk: true
      dirty: false
  bound_files:
    - inode_id: 42
      parent_inode_id: 7
      display_name: note.txt
      relative_path: docs/note.txt
      remote_content_digest: sha256:note-v1
      local_content_digest: sha256:note-v1
      sync_anchor_content_digest: sha256:note-v1

observe_subtree:
  relative_path: ""
  present_entries:
    - kind: dir
      relative_path: ""
    - kind: dir
      relative_path: archive
    - kind: dir
      relative_path: archive/docs
    - kind: file
      relative_path: archive/docs/note.txt
      content_digest: sha256:note-v1

expect:
  paired_bound_move_count: 0
  paired_local_only_move_count: 0
  bound_delete_count: 1
  local_only_observe_count: 2
  planned_decisions:
    delete_subtree: 1
    create_remote_dir: 1
    no_op: 1
