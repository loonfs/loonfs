schema_version: 1
scenario_kind: client
name: observe_subtree_unique_local_only_file_move_under_local_only_parent_preserves_identity

initial:
  namespace_id: ns-1
  bound_directories:
    - inode_id: 1
      parent_inode_id:
      display_name: ""
      relative_path: ""
      exists_on_disk: true
      dirty: false
  local_only_directories:
    - client_file_id: tmp:ns-1:00000000000000000001
      parent_inode_id: 1
      display_name: drafts
      relative_path: drafts
      exists_on_disk: true
      dirty: true
    - client_file_id: tmp:ns-1:00000000000000000002
      parent_inode_id: 1
      display_name: archive
      relative_path: archive
      exists_on_disk: true
      dirty: true
  local_only_files:
    - client_file_id: tmp:ns-1:00000000000000000003
      parent_client_file_id: tmp:ns-1:00000000000000000001
      display_name: note.txt
      relative_path: drafts/note.txt
      content_digest: sha256:note-v1
      exists_on_disk: true
      dirty: true

observe_subtree:
  relative_path: ""
  present_entries:
    - kind: dir
      relative_path: ""
    - kind: dir
      relative_path: drafts
    - kind: dir
      relative_path: archive
    - kind: file
      relative_path: archive/note.txt
      content_digest: sha256:note-v1

expect:
  paired_local_only_move_count: 1
  moved_client_file_id: tmp:ns-1:00000000000000000003
  planned_decisions:
    no_op: 1
