schema_version: 1
scenario_kind: client
name: observe_subtree_skips_untracked_symlink_and_processes_siblings

initial:
  namespace_id: ns-1
  bound_directories:
    - inode_id: 1
      parent_inode_id:
      display_name: ""
      relative_path: ""
      exists_on_disk: true
      dirty: false

observe_subtree:
  relative_path: ""
  present_entries:
    - kind: dir
      relative_path: ""
    - kind: unsupported
      relative_path: current
    - kind: file
      relative_path: note.txt
      content_digest: sha256:note-v1

expect:
  local_only_observe_count: 1
  skipped_unsupported_count: 1
  skipped_unsupported_paths:
    - current
  planned_decisions:
    upload_local_create: 1
