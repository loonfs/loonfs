schema_version: 1
scenario_kind: client
name: observe_bound_file_move_plans_rename

initial:
  namespace_id: ns-1
  bound_parent_directory:
    inode_id: 1
    relative_path: ""
    exists_on_disk: true
    dirty: false
  bound_parent_directory_2:
    inode_id: 7
    relative_path: archive
    exists_on_disk: true
    dirty: false
  bound_file:
    inode_id: 42
    parent_inode_id: 1
    display_name: hello.txt
    remote_content_digest: sha256:hello-v1
    local_content_digest: sha256:hello-v1
    sync_anchor_content_digest: sha256:hello-v1

observe_move:
  kind: bound_file
  from_relative_path: hello.txt
  to_relative_path: archive/hello.txt

expect:
  planned_decision: rename
  planned_reason: local_differs_from_anchor
