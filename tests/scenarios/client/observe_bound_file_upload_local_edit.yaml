scenario_kind: client
name: observe_bound_file_upload_local_edit

initial:
  namespace_id: ns-1
  bound_file:
    inode_id: 42
    parent_inode_id: 1
    display_name: hello.txt
    remote_content_digest: sha256:remote-hello-v1
    local_content_digest: sha256:remote-hello-v1
    sync_anchor_content_digest: sha256:remote-hello-v1

observe_local:
