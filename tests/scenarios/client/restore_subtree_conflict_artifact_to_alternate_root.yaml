schema_version: 1
scenario_kind: client
name: restore_subtree_conflict_artifact_to_alternate_root
initial:
  namespace_id: ns-1
  canonical_root_relative_path: canonical/reports
  restore_root_relative_path: recovered/reports-local
  canonical_files:
    - relative_path: docs/report.txt
      content_utf8: authoritative winner
  loser_entries:
    - relative_path: docs
      inode_kind: dir
      content_utf8: null
      client_file_id: null
    - relative_path: docs/report.txt
      inode_kind: file
      content_utf8: dirty local draft
      client_file_id: null
    - relative_path: scratch.txt
      inode_kind: file
      content_utf8: temp note
      client_file_id: tmp:ns-1:00000000000000000001
expect:
  invariants:
    - conflict_artifact_restore_requires_explicit_absent_destination
    - subtree_conflict_artifact_restore_reproduces_full_loser_tree
    - subtree_conflict_artifact_restore_uses_deterministic_entry_order
    - subtree_conflict_artifact_restore_keeps_canonical_tree_untouched
