schema_version: 1
scenario_kind: client
name: restore_file_conflict_artifact_to_alternate_path
initial:
  namespace_id: ns-1
  canonical_relative_path: canonical/report.txt
  restore_relative_path: recovered/report-local.txt
  canonical_content_utf8: authoritative winner
  loser_content_utf8: local loser
expect:
