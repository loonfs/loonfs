events:
  - kind: renamed
    from_relative_path: docs
    to_relative_path: archive/docs
    inode_kind: dir
  - kind: modified
    relative_path: docs/report.txt
    inode_kind: file
  - kind: created
    relative_path: archive/docs/extra.txt
    inode_kind: file
expect:
  intents:
    - kind: observe_move
      from_relative_path: docs
      to_relative_path: archive/docs
