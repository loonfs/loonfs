schema_version: 1
scenario_kind: client
name: observe_subtree_unique_bound_file_move_plans_rename

initial:
  namespace_id: ns-1
  bound_directories:
    - inode_id: 1
      parent_inode_id:
      display_name: ""
      relative_path: ""
      exists_on_disk: true
      dirty: false
  bound_files:
    - inode_id: 42
      parent_inode_id: 1
      display_name: hello.txt
      relative_path: hello.txt
      remote_content_digest: sha256:hello-v1
