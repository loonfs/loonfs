schema_version: 1
scenario_kind: client
name: observe_subtree_move_with_changed_content_does_not_pair

initial:
  namespace_id: ns-1
  bound_directories:
    - inode_id: 1
      parent_inode_id:
      display_name: ""
      relative_path: ""
      exists_on_disk: true
      dirty: false
  bound_files:
    - inode_id: 42
      parent_inode_id: 1
      display_name: hello.txt
      relative_path: hello.txt
      remote_content_digest: sha256:hello-v1
      local_content_digest: sha256:hello-v1
      sync_anchor_content_digest: sha256:hello-v1

observe_subtree:
  relative_path: ""
  present_entries:
    - kind: dir
      relative_path: ""
    - kind: file
      relative_path: renamed.txt
      content_digest: sha256:hello-v2

expect:
  paired_bound_move_count: 0
  local_only_observe_count: 1
  bound_delete_count: 1
  planned_decisions:
    upload_local_create: 1
    delete_file: 1
