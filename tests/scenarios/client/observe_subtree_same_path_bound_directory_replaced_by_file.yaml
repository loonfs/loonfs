schema_version: 1
scenario_kind: client
name: observe_subtree_same_path_bound_directory_replaced_by_file

initial:
  namespace_id: ns-1
  bound_directories:
    - inode_id: 1
      parent_inode_id:
      display_name: ""
      relative_path: ""
      exists_on_disk: true
      dirty: false
    - inode_id: 7
      parent_inode_id: 1
      display_name: docs
      relative_path: docs
      exists_on_disk: true
      dirty: false
  bound_files:
    - inode_id: 88
      parent_inode_id: 7
      display_name: note.txt
      relative_path: docs/note.txt
      remote_content_digest: sha256:note-v1
      local_content_digest: sha256:note-v1
      sync_anchor_content_digest: sha256:note-v1

observe_subtree:
  relative_path: ""
  present_entries:
    - kind: dir
      relative_path: ""
    - kind: file
      relative_path: docs
      content_digest: sha256:replacement-v1

expect:
  bound_delete_count: 1
  local_only_observe_count: 1
  planned_decisions:
    delete_subtree: 1
    upload_local_create: 1
