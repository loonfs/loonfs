            min_key: tombstone-00000000000000000099-00000000000000000039
            max_key: tombstone-00000000000000000099-00000000000000000039
            row_keys:
              - tombstone-00000000000000000099-00000000000000000039
            rows:
              - row_kind: tombstone
                root_inode_id: 99
                tombstone_seq: 39
  wal_objects:
    - key: namespaces/ns-1/wal/00000000000000000041-req-20260311-0001.cbor.zst
      payload:
        namespace_id: ns-1
        seq: 41
        base_head_seq: 40
        commit_id: req-20260311-0001
        writer_fence_token: 9
        ops:
          - op_kind: replace_file
            inode_id: 42
            base_revision: 7
            content_manifest_digest: sha256:report-v8
actions:
  - replay_from_checkpoint_and_wal_tail: true
expect:
  final_head:
    namespace_id: ns-1
    seq: 41
    active_fence_token: 9
    next_inode_id: 501
    snapshot_hint_seq: 40
    retention_floor_seq: 40
  final_metadata_state:
    inodes:
      - inode_id: 2
        inode_kind: dir
        created_seq: 1
      - inode_id: 42
        inode_kind: file
        created_seq: 17
    direntries:
      - parent_inode_id: 2
        name_key: report.txt
        display_name: report.txt
        child_inode_id: 42
        bind_seq: 17
    revisions:
      - inode_id: 42
        revision_no: 7
        committed_seq: 40
        content_manifest_digest: sha256:report-v7
      - inode_id: 42
        revision_no: 8
        committed_seq: 41
        content_manifest_digest: sha256:report-v8
    subtree_tombstones:
      - root_inode_id: 99
        tombstone_seq: 39
  invariants:
    - checkpoint_manifest_checksum_matches_payload
    - checkpoint_manifest_key_matches_seq
    - checkpoint_manifest_must_be_verified
    - checkpoint_replay_requires_all_manifest_segments
    - checkpoint_segment_descriptor_matches_payload
    - checkpoint_segment_rows_restore_basis_metadata
    - wal_replay_applies_metadata_rows
    - replace_file_appends_new_revision_head
    - checkpoint_plus_wal_tail_reproduces_head
    - checkpoint_plus_wal_tail_reproduces_metadata
