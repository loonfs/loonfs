name: checkpoint_manifest_plus_wal_tail_reproduces_head
initial:
  checkpoint_manifest:
    key: namespaces/ns-1/snapshots/00000000000000000040/manifest.json
    payload:
      namespace_id: ns-1
      checkpoint_seq: 40
      active_fence_token: 8
      next_inode_id: 501
      retention_floor_seq: 40
      verified: true
      tables:
        - family: inodes
          segments:
            - object_key: namespaces/ns-1/snapshots/00000000000000000040/tables/inodes-00000.sst.zst
              segment_index: 0
              row_count: 500
              min_key: inode-1
              max_key: inode-500
              payload_checksum_sha256: seg-checksum-1
              page_checksums_sha256:
                - page-checksum-1
  wal_objects:
    - key: namespaces/ns-1/wal/00000000000000000041-req-20260311-0001.cbor.zst
      payload:
        namespace_id: ns-1
        seq: 41
        base_head_seq: 40
        commit_id: req-20260311-0001
        writer_fence_token: 9
actions:
  - replay_from_checkpoint_and_wal_tail: true
expect:
  final_head:
    namespace_id: ns-1
    seq: 41
    active_fence_token: 9
    next_inode_id: 501
    snapshot_hint_seq: 40
    retention_floor_seq: 40
  invariants:
    - checkpoint_manifest_checksum_matches_payload
    - checkpoint_manifest_key_matches_seq
    - checkpoint_manifest_must_be_verified
    - checkpoint_plus_wal_tail_reproduces_head
