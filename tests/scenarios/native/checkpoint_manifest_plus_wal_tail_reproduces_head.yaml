schema_version: 1
scenario_kind: native
name: checkpoint_manifest_plus_wal_tail_reproduces_head
initial:
  checkpoint_manifest:
    key: namespaces/ns-1/snapshots/00000000000000000040/manifest.json
    payload:
      namespace_id: ns-1
      checkpoint_seq: 40
      active_fence_token: 8
      next_inode_id: 501
      retention_floor_seq: 40
      verified: true
      tables:
        - family: inodes
          segments:
            - object_key: namespaces/ns-1/snapshots/00000000000000000040/tables/inodes-00000.sst.zst
              segment_index: 0
              row_count: 2
              min_key: inode-00000000000000000002
              max_key: inode-00000000000000000042
              payload_checksum_sha256: fixture-inodes
              page_checksums_sha256:
                - fixture-inodes-page-0
        - family: direntries
          segments:
            - object_key: namespaces/ns-1/snapshots/00000000000000000040/tables/direntries-00000.sst.zst
              segment_index: 0
              row_count: 1
              min_key: direntry-00000000000000000002-report.txt-00000000000000000017
              max_key: direntry-00000000000000000002-report.txt-00000000000000000017
              payload_checksum_sha256: fixture-direntries
              page_checksums_sha256:
                - fixture-direntries-page-0
        - family: revisions
          segments:
            - object_key: namespaces/ns-1/snapshots/00000000000000000040/tables/revisions-00000.sst.zst
              segment_index: 0
              row_count: 1
              min_key: revision-00000000000000000042-00000000000000000007
              max_key: revision-00000000000000000042-00000000000000000007
              payload_checksum_sha256: fixture-revisions
              page_checksums_sha256:
                - fixture-revisions-page-0
        - family: tombstones
          segments:
            - object_key: namespaces/ns-1/snapshots/00000000000000000040/tables/tombstones-00000.sst.zst
              segment_index: 0
              row_count: 1
              min_key: tombstone-00000000000000000099-00000000000000000039
              max_key: tombstone-00000000000000000099-00000000000000000039
              payload_checksum_sha256: fixture-tombstones
              page_checksums_sha256:
                - fixture-tombstones-page-0
  checkpoint_segments:
    - key: namespaces/ns-1/snapshots/00000000000000000040/tables/inodes-00000.sst.zst
      payload:
        namespace_id: ns-1
        checkpoint_seq: 40
        family: inodes
        segment_index: 0
        row_count: 2
        min_key: inode-00000000000000000002
        max_key: inode-00000000000000000042
        pages:
          - page_index: 0
            min_key: inode-00000000000000000002
            max_key: inode-00000000000000000042
            row_keys:
              - inode-00000000000000000002
              - inode-00000000000000000042
            rows:
              - row_kind: inode
                inode_id: 2
                inode_kind: dir
                created_seq: 1
              - row_kind: inode
                inode_id: 42
                inode_kind: file
                created_seq: 17
    - key: namespaces/ns-1/snapshots/00000000000000000040/tables/direntries-00000.sst.zst
      payload:
        namespace_id: ns-1
        checkpoint_seq: 40
        family: direntries
        segment_index: 0
        row_count: 1
        min_key: direntry-00000000000000000002-report.txt-00000000000000000017
        max_key: direntry-00000000000000000002-report.txt-00000000000000000017
        pages:
          - page_index: 0
            min_key: direntry-00000000000000000002-report.txt-00000000000000000017
            max_key: direntry-00000000000000000002-report.txt-00000000000000000017
            row_keys:
              - direntry-00000000000000000002-report.txt-00000000000000000017
            rows:
              - row_kind: direntry
                parent_inode_id: 2
                name_key: report.txt
                display_name: report.txt
                child_inode_id: 42
                bind_seq: 17
    - key: namespaces/ns-1/snapshots/00000000000000000040/tables/revisions-00000.sst.zst
      payload:
        namespace_id: ns-1
        checkpoint_seq: 40
        family: revisions
        segment_index: 0
        row_count: 1
        min_key: revision-00000000000000000042-00000000000000000007
        max_key: revision-00000000000000000042-00000000000000000007
        pages:
          - page_index: 0
            min_key: revision-00000000000000000042-00000000000000000007
            max_key: revision-00000000000000000042-00000000000000000007
            row_keys:
              - revision-00000000000000000042-00000000000000000007
            rows:
              - row_kind: revision
                inode_id: 42
                revision_no: 7
                committed_seq: 40
                content_manifest_digest: sha256:report-v7
    - key: namespaces/ns-1/snapshots/00000000000000000040/tables/tombstones-00000.sst.zst
      payload:
        namespace_id: ns-1
        checkpoint_seq: 40
        family: tombstones
        segment_index: 0
        row_count: 1
        min_key: tombstone-00000000000000000099-00000000000000000039
        max_key: tombstone-00000000000000000099-00000000000000000039
        pages:
