name: namespace_lease_handover_fences_stale_writer
initial:
  head:
    namespace_id: ns-1
    seq: 41
    active_fence_token: 8
    next_inode_id: 501
    snapshot_hint_seq: 40
    retention_floor_seq: 40
  lease:
    namespace_id: ns-1
    holder_id: writer-a
    fence_token: 8
    lease_expires_at_ms: 1000
actions:
  - writer_a_reads_current_head: true
  - lease_handover:
      new_holder_id: writer-b
      new_fence_token: 9
      lease_expires_at_ms: 2000
  - writer_b_publishes_new_head:
      seq: 42
      active_fence_token: 9
      next_inode_id: 504
  - writer_a_attempts_publish:
      planned_head_seq: 41
      writer_fence_token: 8
expect:
  invariants:
    - stale_writer_cannot_publish
    - head_and_lease_fence_tokens_agree
