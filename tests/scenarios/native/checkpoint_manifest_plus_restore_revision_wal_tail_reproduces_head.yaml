name: checkpoint_manifest_plus_restore_revision_wal_tail_reproduces_head
initial:
  checkpoint_manifest:
    key: namespaces/ns-1/snapshots/00000000000000000052/manifest.json
    payload:
      namespace_id: ns-1
      checkpoint_seq: 52
      active_fence_token: 8
      next_inode_id: 501
      retention_floor_seq: 50
      verified: true
      tables:
        - family: inodes
          segments:
            - object_key: namespaces/ns-1/snapshots/00000000000000000052/tables/inodes-00000.sst.zst
              segment_index: 0
              row_count: 2
              min_key: inode-00000000000000000002
              max_key: inode-00000000000000000042
              payload_checksum_sha256: fixture-inodes
              page_checksums_sha256:
                - fixture-inodes-page-0
        - family: direntries
          segments:
            - object_key: namespaces/ns-1/snapshots/00000000000000000052/tables/direntries-00000.sst.zst
              segment_index: 0
              row_count: 1
              min_key: direntry-00000000000000000002-report.txt-00000000000000000009
              max_key: direntry-00000000000000000002-report.txt-00000000000000000009
              payload_checksum_sha256: fixture-direntries
              page_checksums_sha256:
                - fixture-direntries-page-0
        - family: revisions
          segments:
            - object_key: namespaces/ns-1/snapshots/00000000000000000052/tables/revisions-00000.sst.zst
              segment_index: 0
              row_count: 2
              min_key: revision-00000000000000000042-00000000000000000003
              max_key: revision-00000000000000000042-00000000000000000005
              payload_checksum_sha256: fixture-revisions
              page_checksums_sha256:
                - fixture-revisions-page-0
        - family: tombstones
          segments:
            - object_key: namespaces/ns-1/snapshots/00000000000000000052/tables/tombstones-00000.sst.zst
              segment_index: 0
              row_count: 0
              min_key: ""
              max_key: ""
              payload_checksum_sha256: fixture-tombstones
              page_checksums_sha256:
                - fixture-tombstones-page-0
  checkpoint_segments:
    - key: namespaces/ns-1/snapshots/00000000000000000052/tables/inodes-00000.sst.zst
      payload:
        namespace_id: ns-1
        checkpoint_seq: 52
        family: inodes
        segment_index: 0
        row_count: 2
        min_key: inode-00000000000000000002
        max_key: inode-00000000000000000042
        pages:
          - page_index: 0
            min_key: inode-00000000000000000002
            max_key: inode-00000000000000000042
            row_keys:
              - inode-00000000000000000002
              - inode-00000000000000000042
            rows:
              - row_kind: inode
                inode_id: 2
                inode_kind: dir
                created_seq: 1
              - row_kind: inode
                inode_id: 42
                inode_kind: file
                created_seq: 9
    - key: namespaces/ns-1/snapshots/00000000000000000052/tables/direntries-00000.sst.zst
      payload:
        namespace_id: ns-1
        checkpoint_seq: 52
        family: direntries
        segment_index: 0
        row_count: 1
        min_key: direntry-00000000000000000002-report.txt-00000000000000000009
        max_key: direntry-00000000000000000002-report.txt-00000000000000000009
        pages:
          - page_index: 0
            min_key: direntry-00000000000000000002-report.txt-00000000000000000009
            max_key: direntry-00000000000000000002-report.txt-00000000000000000009
            row_keys:
              - direntry-00000000000000000002-report.txt-00000000000000000009
            rows:
              - row_kind: direntry
                parent_inode_id: 2
                name_key: report.txt
                display_name: report.txt
                child_inode_id: 42
                bind_seq: 9
    - key: namespaces/ns-1/snapshots/00000000000000000052/tables/revisions-00000.sst.zst
      payload:
        namespace_id: ns-1
        checkpoint_seq: 52
        family: revisions
        segment_index: 0
        row_count: 2
        min_key: revision-00000000000000000042-00000000000000000003
        max_key: revision-00000000000000000042-00000000000000000005
        pages:
          - page_index: 0
            min_key: revision-00000000000000000042-00000000000000000003
            max_key: revision-00000000000000000042-00000000000000000005
            row_keys:
              - revision-00000000000000000042-00000000000000000003
              - revision-00000000000000000042-00000000000000000005
            rows:
              - row_kind: revision
                inode_id: 42
                revision_no: 3
                committed_seq: 17
                content_manifest_digest: sha256:report-v3
              - row_kind: revision
                inode_id: 42
                revision_no: 5
                committed_seq: 52
                content_manifest_digest: sha256:report-v5
    - key: namespaces/ns-1/snapshots/00000000000000000052/tables/tombstones-00000.sst.zst
      payload:
        namespace_id: ns-1
        checkpoint_seq: 52
        family: tombstones
        segment_index: 0
        row_count: 0
        min_key: ""
        max_key: ""
        pages:
          - page_index: 0
            min_key: ""
            max_key: ""
            row_keys: []
            rows: []
  wal_objects:
    - key: namespaces/ns-1/wal/00000000000000000053-req-20260314-restore-0001.cbor.zst
      payload:
        namespace_id: ns-1
        seq: 53
        base_head_seq: 52
        commit_id: req-20260314-restore-0001
        writer_fence_token: 9
        ops:
          - op_kind: restore_revision
            inode_id: 42
            base_revision: 5
            restore_from_revision: 3
actions:
  - replay_from_checkpoint_and_wal_tail: true
expect:
  final_head:
    namespace_id: ns-1
    seq: 53
    active_fence_token: 9
    next_inode_id: 501
    snapshot_hint_seq: 52
    retention_floor_seq: 50
  final_metadata_state:
    inodes:
      - inode_id: 2
        inode_kind: dir
        created_seq: 1
      - inode_id: 42
        inode_kind: file
        created_seq: 9
    direntries:
      - parent_inode_id: 2
        name_key: report.txt
        display_name: report.txt
        child_inode_id: 42
        bind_seq: 9
    revisions:
      - inode_id: 42
        revision_no: 3
        committed_seq: 17
        content_manifest_digest: sha256:report-v3
      - inode_id: 42
        revision_no: 5
        committed_seq: 52
        content_manifest_digest: sha256:report-v5
      - inode_id: 42
        revision_no: 6
        committed_seq: 53
        content_manifest_digest: sha256:report-v3
    subtree_tombstones: []
  invariants:
    - checkpoint_manifest_checksum_matches_payload
    - checkpoint_manifest_key_matches_seq
    - checkpoint_manifest_must_be_verified
    - checkpoint_replay_requires_all_manifest_segments
    - checkpoint_segment_descriptor_matches_payload
    - checkpoint_segment_rows_restore_basis_metadata
    - wal_replay_applies_metadata_rows
    - restore_creates_new_revision_head
    - checkpoint_plus_wal_tail_reproduces_head
    - checkpoint_plus_wal_tail_reproduces_metadata
