schema_version: 1
scenario_kind: native
name: authoritative_file_cli_rejects_directory_reads_and_surfaces_content_corruption
initial:
  head:
    namespace_id: demo
    seq: 9
  metadata_state:
    visible_bindings:
      - absolute_path: /
        inode_id: 1
        inode_kind: dir
      - absolute_path: /docs
        inode_id: 2
        inode_kind: dir
      - absolute_path: /broken.txt
        inode_id: 3
        inode_kind: file
        revision_no: 1
        content_manifest_digest: sha256:broken
actions:
  - cat_file:
      selector: demo:/docs
  - get_file:
      selector: demo:/broken.txt
      local_path: ./broken.txt
expect:
  failures:
    - selector: demo:/docs
      error: file_command_requires_file
    - selector: demo:/broken.txt
      error: content_validation_failed
