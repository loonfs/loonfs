    seq: 41
    active_fence_token: 8
    next_inode_id: 501
    snapshot_hint_seq: 40
    retention_floor_seq: 40
  lease:
    namespace_id: ns-1
    holder_id: writer-a
    fence_token: 8
    lease_expires_at_ms: 2000
  metadata_state:
    inodes:
      - inode_id: 2
        inode_kind: dir
