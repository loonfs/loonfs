name: queue_shard_claim_timeout_then_steal_updates_object
initial:
  queue_shard:
    key: queue/shards/00017.json
    payload:
      work_class: BuildSnapshot
      shard_id: 17
      broker: null
      jobs:
        - job_id: job-1
          dedupe_key: BuildSnapshot:ns-1
          state: Ready
          payload:
            namespace_id: ns-1
            through_seq: 420
actions:
  - renew_broker_lease:
      shard_id: 17
      work_class: BuildSnapshot
      broker: broker-a
      now_ms: 0
      lease_duration_ms: 10000
  - claim_queue_job:
      shard_id: 17
      broker: broker-a
      broker_epoch: 1
      worker: worker-a
      claim_token: claim-a
      job_id: job-1
      now_ms: 0
      claim_timeout_ms: 10000
  - renew_broker_lease:
      shard_id: 17
      work_class: BuildSnapshot
      broker: broker-b
      now_ms: 30000
      lease_duration_ms: 10000
  - claim_queue_job:
      shard_id: 17
      broker: broker-b
      broker_epoch: 2
      worker: worker-b
      claim_token: claim-b
      job_id: job-1
      now_ms: 30000
      claim_timeout_ms: 10000
  - complete_queue_job:
      shard_id: 17
      broker: broker-b
      broker_epoch: 2
      claim_token: claim-a
      job_id: job-1
      now_ms: 30001
      expect_error: ClaimTokenMismatch
  - complete_queue_job:
      shard_id: 17
      broker: broker-b
      broker_epoch: 2
      claim_token: claim-b
      job_id: job-1
      now_ms: 30001
expect:
  queue_shard:
    key: queue/shards/00017.json
    payload:
      work_class: BuildSnapshot
      shard_id: 17
      broker:
        broker_id: broker-b
        epoch: 2
        lease_expires_at_ms: 40000
      jobs: []
  invariants:
    - queue_shard_checksum_matches_payload
    - queue_shard_key_matches_shard_id
    - queue_shard_cas_protects_updates
    - active_broker_lease_required_for_shard_mutation
    - claim_timeout_allows_steal
    - stale_claim_token_cannot_complete
    - stolen_job_completes_once
