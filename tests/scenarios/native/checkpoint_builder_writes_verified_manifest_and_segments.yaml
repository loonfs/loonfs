schema_version: 1
scenario_kind: native
name: checkpoint_builder_writes_verified_manifest_and_segments
initial:
  head:
    namespace_id: ns-1
    seq: 42
    active_fence_token: 9
    next_inode_id: 777
    snapshot_hint_seq: 40
    retention_floor_seq: 40
  metadata_state:
    inodes:
      - inode_id: 2
        inode_kind: dir
        created_seq: 1
      - inode_id: 9
        inode_kind: file
        created_seq: 42
    direntries:
      - parent_inode_id: 2
        name_key: report.txt
        display_name: report.txt
        child_inode_id: 9
        bind_seq: 42
        bind_op_index: 0
    revisions:
      - inode_id: 9
        revision_no: 1
        committed_seq: 42
        revision_op_index: 0
        content_manifest_digest: sha256:checkpoint
actions:
  - build_checkpoint: true
expect:
  checkpoint_manifest:
    key: namespaces/ns-1/snapshots/00000000000000000042/manifest.json
    payload:
      namespace_id: ns-1
      checkpoint_seq: 42
      active_fence_token: 9
      next_inode_id: 777
      retention_floor_seq: 40
      verified: true
  checkpoint_segments:
    - key: namespaces/ns-1/snapshots/00000000000000000042/tables/inodes-00000.sst.zst
      payload:
        namespace_id: ns-1
        checkpoint_seq: 42
        family: inodes
        segment_index: 0
        row_count: 2
    - key: namespaces/ns-1/snapshots/00000000000000000042/tables/direntries-00000.sst.zst
      payload:
        namespace_id: ns-1
        checkpoint_seq: 42
        family: direntries
        segment_index: 0
        row_count: 1
    - key: namespaces/ns-1/snapshots/00000000000000000042/tables/revisions-00000.sst.zst
      payload:
        namespace_id: ns-1
        checkpoint_seq: 42
        family: revisions
        segment_index: 0
        row_count: 1
    - key: namespaces/ns-1/snapshots/00000000000000000042/tables/tombstones-00000.sst.zst
      payload:
        namespace_id: ns-1
        checkpoint_seq: 42
        family: tombstones
        segment_index: 0
        row_count: 0
  invariants:
    - checkpoint_segment_payload_checksum_matches_payload
    - checkpoint_segment_key_matches_family_and_index
    - verified_checkpoint_manifest_requires_durable_segments
    - checkpoint_manifest_preserves_head_summary
    - checkpoint_manifest_preserves_basis_metadata
