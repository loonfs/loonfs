bind = "127.0.0.1:9400"
auth_token = "dev-token"
content_token_secret = "dev-content-token-secret"
writer_id = "loonfs-server-aws"

[store]
kind = "aws-s3"
bucket = "your-bucket"
region = "us-east-1"
# endpoint_url is optional for AWS S3. If you set a custom endpoint with
# force_path_style = false, LoonFS accepts either a bucket-specific endpoint
# like "https://your-bucket.s3.us-east-1.amazonaws.com" or a bucket-less
# regional endpoint like "https://s3.us-east-1.amazonaws.com".
access_key_id = "YOUR_ACCESS_KEY_ID"
secret_access_key = "YOUR_SECRET_ACCESS_KEY"
key_prefix = "loonfs-demo"
force_path_style = false
