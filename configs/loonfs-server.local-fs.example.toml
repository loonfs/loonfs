bind = "127.0.0.1:9400"
# auth_token and content_token_secret may instead come from the
# LOONFS_AUTH_TOKEN and LOONFS_CONTENT_TOKEN_SECRET environment variables;
# a non-blank value in this file takes precedence over the environment.
# A non-loopback bind refuses to load without auth_token unless
# allow_unauthenticated_remote = true is set explicitly.
auth_token = "dev-token"
content_token_secret = "dev-content-token-secret"
writer_id = "loonfs-server-local"

# Whether this server maintains the namespaces it touches by itself:
# "automatic" (the default) registers the metadata, collection, and — when
# the grep mode below maintains — index jobs, and lets the writer schedule
# them; "manual" registers none of them and schedules nothing, leaving every
# `loonfs admin` operation working exactly as before. Set "manual" on a
# write-serving node when a dedicated maintenance process owns these
# namespaces, and assign them to it with `loonfs admin run --namespace ...`.
# This word and the grep mode are the only maintenance switches.
#maintenance = "automatic"

# Largest request body accepted for service-proxied upload content, in
# bytes; the server buffers each upload in memory. Advertised to clients as
# the `upload.max_content_bytes` capability limit. Defaults to 256 MiB.
#max_upload_bytes = 268435456

# Largest file content a service-proxied read will buffer and return, in
# bytes; over-limit reads answer `content_too_large`. Advertised to clients
# as the `download.max_content_bytes` capability limit. Defaults to 256 MiB.
#max_download_bytes = 268435456

# Largest JSON body the commits endpoint accepts, in bytes. Commit bodies
# are metadata only (file bytes ride uploads), so over-limit commits should
# be split into smaller batches. Advertised to clients as the
# `commit.max_body_bytes` capability limit. Defaults to 8 MiB.
#max_commit_body_bytes = 8388608

# How many proxied upload bodies / content reads the server will hold in
# memory at once; requests past a cap answer 503 `server_busy`. Worst-case
# transfer memory is the count cap times the matching byte cap.
#max_concurrent_uploads = 8
#max_concurrent_downloads = 16

# How many background maintenance ticks may run at once across all
# namespaces (each namespace already runs at most one). Defaults to 2.
#max_concurrent_maintenance = 2

# Direct-put needs no configuration. It is offered only where the adapter can
# presign a create-only, checksum-bound PUT and the endpoint is a first-party
# AWS S3 or Cloudflare R2 domain, so it is unavailable on this local-fs store.
# Clients gate on `core.uploads.direct_put` in the capability document.

# Optional runtime cache overrides; omitted fields keep the runtime defaults.
#[runtime_cache]
#max_cached_namespaces = 64
#max_cached_wal_tail_projection_rows = 1000000
#max_cached_wal_tail_projection_decoded_bytes = 268435456
# Decoded-byte budget for the metadata table cache; unlimited by default.
#metadata_table_cache_max_decoded_bytes = 268435456

# Omit the `[grep]` table and this server composes no grep at all: uniform
# `not_supported` responses, and no `query.grep` feature or limits advertised.
# A `[grep]` table with no `mode` both serves searches and maintains the index.
# `serve_only` answers searches over an index another process maintains;
# `maintain_only` maintains the index without answering searches; `disabled`
# turns both off again.
#[grep]
#mode = "serve_and_maintain"
# Bounded build/fold budgets; every value must be greater than zero. How many
# maintenance steps run at once — grep's included — is `max_concurrent_maintenance`.
#max_files_per_step = 256
#max_content_bytes_per_step = 67108864
#max_rows_per_segment = 65536
#max_l0_runs = 8
#max_mid_runs = 8
#max_fold_rows_per_step = 131072

[store]
kind = "local-fs"
root = "./.loonfs-store"
key_prefix = "local-demo"
